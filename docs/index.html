          if (!isNaN(idx) && currentSessions[idx]) playSession(currentSessions[idx]);
          return;
        }
        playPause();
      });

      if (stepBackBtn) stepBackBtn.addEventListener("click", () => stepFrame(-1));
      if (stepFwdBtn) stepFwdBtn.addEventListener("click", () => stepFrame(1));

      // The scrubber only needs to pause + seek on drag - the always-running
      // global playback loop naturally continues from wherever elapsedMs
      // ends up once paused is set back to false, so there's no separate
      // resume logic needed here (unlike the earlier duplicated-tick version).
      const scrubber = document.getElementById("sessionScrubber");
      if (scrubber) {
        scrubber.addEventListener("input", () => {
          if (!activePlayback) return;
          activePlayback.paused = true;
          setPlayButtonIcon(true);
          const frac = parseInt(scrubber.value, 10) / 1000;
          activePlayback.elapsedMs = frac * activePlayback.PLAYBACK_MS;
          activePlayback.seekTo(frac, true);
        });
      }

      // Load the first known player on open.
      if (ROUTE_PLAYERS.length) loadAndRenderPlayer(ROUTE_PLAYERS[0].hash);
    }

    // Very subtle seasonal tint - a faint colour shift in the background
    // gradient, nothing animated or attention-grabbing.
    (function setSeasonTint() {
      const month = new Date().getMonth(); // 0=Jan
      const tints = {
        winter: "rgba(79,142,240,0.18)",   // Dec/Jan/Feb - cool blue
        spring: "rgba(123,216,143,0.14)",  // Mar/Apr/May - soft green
        summer: "rgba(255,210,79,0.13)",   // Jun/Jul/Aug - warm gold
        autumn: "rgba(255,159,67,0.16)",   // Sep/Oct/Nov - amber
      };
      const season = [11, 0, 1].includes(month) ? "winter"
        : [2, 3, 4].includes(month) ? "spring"
        : [5, 6, 7].includes(month) ? "summer" : "autumn";
      document.documentElement.style.setProperty("--season-tint", tints[season]);
    })();

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    async function renderPatchNotes() {
      const el = document.getElementById("patchNoteBanner");
      try {
        const res = await fetch("data/patch-notes.json?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) return;
        const note = await res.json();
        if (!note || !note.title) return;
        const dateStr = note.pubDate ? new Date(note.pubDate).toLocaleDateString("en-US", {
          month: "short", day: "numeric"
        }) : "";
        el.innerHTML = '<div class="patch-banner">' +
          '<span class="pb-tag">Latest update</span>' +
          '<a href="' + escapeHtml(note.link || "#") + '" target="_blank" rel="noopener">' + escapeHtml(note.title) + '</a>' +
          (dateStr ? '<span class="pb-date">' + dateStr + '</span>' : '') +
          '</div>';
      } catch (err) {
        console.error("Patch notes error:", err);
      }
    }

    async function init() {
      let data;
      try {
        const res = await fetch("data/latest.json?t=" + Date.now(), { cache: "no-store" });
        data = await res.json();
      } catch (err) {
        document.getElementById("updated").textContent = "Failed to load data.";
        console.error(err);
        return;
      }

      document.getElementById("updated").textContent =
        "Updated " + new Date(data.updated).toLocaleString();

      const board = document.getElementById("board");
      const histories = await Promise.all(data.players.map(p => loadHistory(p.username)));

      // Earliest calendar day (UK date) ANY player has a recorded XP gain -
      // shared across all three calendars so they all start on the same
      // real week, rather than each player's grid independently starting
      // from their own first-played date. Recomputed live from the actual
      // data every load, so it stays correct automatically (new month, a
      // new player added, earlier history compacted, etc.) with nothing to
      // manually update here.
      let globalStartDate = null;
      histories.forEach(h => {
        (h && h.history ? h.history : []).forEach(e => {
          if (!e.totalGain || e.totalGain <= 0) return;
          const day = londonDateKey(new Date(e.timestamp));
          if (!globalStartDate || day < globalStartDate) globalStartDate = day;
        });
      });

      data.players.forEach((player, i) => {
        board.appendChild(renderColumn(player, histories[i], globalStartDate));
      });

      initTabs();
      renderGauntletLuck(data.players);
      renderRangerLuck(data.players);
      renderPatchNotes();
      initSessionControls();
    }

    init();
  </script>
</body>
