    const INSTANCE_BANNER_WINDOW_MS = 1200;

    // Distinguishes "no imagery here" (a few errors, usually inside an
    // instance) from "tile server unreachable" (nothing but errors for a
    // sustained stretch), and says so in the status text.
    let tileErrorsSinceLoad = 0;
    const TILE_OUTAGE_ERRORS = 12;
    const TILE_OUTAGE_WINDOW_MS = 8000;
    function noteTileLoad() {
      tileErrorsSinceLoad = 0;
      const el = document.getElementById("sessionStatus");
      if (el && el.dataset.outage) { el.dataset.outage = ""; el.textContent = ""; }
    }
    function noteTileError() {
      tileErrorsSinceLoad++;
      const quietFor = Date.now() - lastTileLoadTime;
      if (tileErrorsSinceLoad >= TILE_OUTAGE_ERRORS && quietFor > TILE_OUTAGE_WINDOW_MS) {
        const el = document.getElementById("sessionStatus");
        if (el) { el.dataset.outage = "1"; el.textContent = "Map tiles unreachable"; }
      }
    }

    function updateInstanceBanner() {
      const banner = document.getElementById("instanceBanner");
      if (!banner) return;
      const now = Date.now();
      const recentlyFailed = lastTileErrorTime > 0 && (now - lastTileErrorTime) < INSTANCE_BANNER_WINDOW_MS;
      const recentlyLoaded = lastTileLoadTime > 0 && (now - lastTileLoadTime) < INSTANCE_BANNER_WINDOW_MS;
      banner.style.display = (recentlyFailed && !recentlyLoaded) ? "block" : "none";
    }

    // Stock Leaflet gives up on a tile the first time its request fails,
    // leaving a blank square until something forces a fresh request (a
    // zoom change, usually). This retries a failed tile a few times with
    // increasing delay before giving up, which is the difference between
    // a momentary hiccup and a black patch that sits there.
    const TILE_RETRY_DELAYS_MS = [400, 1500, 4000];

    // The tile host doesn't send CORS headers, so tiles are fetched as
    // plain image requests and the service worker (sw.js) cannot see their
    // status codes - it caches whatever comes back. If a cached tile turns
    // out to be broken (the image fails to decode), the page drops that
    // entry so the retry goes back to the network instead of hitting the
    // same bad copy again.
    const TILE_CACHE_NAME = "rs-map-tiles-v2";
    function evictTileFromCache(url) {
      if (!("caches" in window)) return;
      const key = url.split("?")[0];
      caches.open(TILE_CACHE_NAME).then(c => c.delete(key)).catch(() => {});
    }
    const RetryingTileLayer = L.TileLayer.extend({
      createTile: function (coords, done) {
        const tile = document.createElement("img");
        const url = this.getTileUrl(coords);
        const key = this._tileCoordsToKey(coords);
        let attempt = 0;

        L.DomEvent.on(tile, "load", L.Util.bind(this._tileOnLoad, this, done, tile));
        L.DomEvent.on(tile, "error", (e) => {
          // Only retry while Leaflet still wants this tile - if it was
          // pruned after a pan/zoom there's nothing to put the image in.
          evictTileFromCache(url);
          if (attempt < TILE_RETRY_DELAYS_MS.length && this._tiles[key]) {
            const delay = TILE_RETRY_DELAYS_MS[attempt++];
            setTimeout(() => {
              if (!this._tiles[key]) return;
              tile.src = url + (url.indexOf("?") === -1 ? "?" : "&") + "retry=" + attempt;
            }, delay);
            return;
          }
          this._tileOnError(done, tile, e);
        });

        if (this.options.crossOrigin || this.options.crossOrigin === "") {
          tile.crossOrigin = this.options.crossOrigin === true ? "" : this.options.crossOrigin;
        }
        tile.alt = "";
        tile.setAttribute("role", "presentation");
        tile.src = url;
        return tile;
      }
    });

    function initLeafletMap() {
      if (leafletMap) return;
      leafletMap = L.map("leafletMap", {
        zoomControl: false,
        attributionControl: false,
        renderer: L.canvas()
      });
      L.control.zoom().addTo(leafletMap);

      planeTileLayer = new RetryingTileLayer(tileUrlTemplate(currentPlane), {
        minZoom: MAP_MIN_ZOOM,
        maxZoom: MAP_MAX_ZOOM,
        noWrap: true,
        tms: true,
        keepBuffer: 4
      }).addTo(leafletMap);

      planeTileLayer.on("tileload", () => { lastTileLoadTime = Date.now(); noteTileLoad(); updateInstanceBanner(); });
      planeTileLayer.on("tileerror", () => { lastTileErrorTime = Date.now(); noteTileError(); updateInstanceBanner(); });
      planeTileLayer.on("load", pumpPrefetchQueue);
      leafletMap.on("moveend zoomend", updateInstanceBanner);

      routeLayerGroup = L.layerGroup().addTo(leafletMap);

      leafletMap.setView(gameToLatLng(3221, 3217), 7);

      initPlaneControl();

      const closeBtn = document.getElementById("mapCloseBtn");
      if (closeBtn) closeBtn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        document.getElementById("panel-skills").classList.add("active");
        document.querySelector('.tab-btn[data-tab="skills"]').classList.add("active");
      });

      const heatmapBtn = document.getElementById("heatmapToggleBtn");
      if (heatmapBtn) heatmapBtn.addEventListener("click", toggleHeatmap);

      const fogBtn = document.getElementById("fogToggleBtn");
      if (fogBtn) fogBtn.addEventListener("click", toggleFog);

      const allBtn = document.getElementById("overlayAllBtn");
      if (allBtn) allBtn.addEventListener("click", toggleOverlayAll);

      const rangeBtn = document.getElementById("overlayRangeBtn");
      if (rangeBtn) rangeBtn.addEventListener("click", cycleOverlayRange);

      // Keep the fog canvas sized to the map if the window/orientation
      // changes (Leaflet handles its own tiles on resize).
      window.addEventListener("resize", () => { if (fogEnabled) redrawFog(); });
      // Redraw the real (punched-holes) fog only once the pan/zoom has
      // actually settled, not on every intermediate frame of Leaflet's own
      // zoom animation - the hole positions are computed from screen pixel
      // coordinates at a specific zoom, so recalculating them mid-animation
      // fights against the animation and looks janky. While it's actually
      // animating, show plain full-coverage fog instead (everything hidden
      // until the redraw), rather than a stale, misaligned set of holes.
      leafletMap.on("move", () => {
        if (fogEnabled) trackFogToView(leafletMap.getCenter(), leafletMap.getZoom());
        positionFxHpBar();
      });
      leafletMap.on("zoomend", positionFxHpBar);
      leafletMap.on("zoomanim", (e) => {
        if (fogEnabled) trackFogToView(e.center, e.zoom);
      });
      leafletMap.on("moveend zoomend", () => {
        if (fogEnabled) requestAnimationFrame(redrawFog);
      });
    }

    // ---- Heatmap ----
    //
    // Aggregates every recorded position (walk waypoints + teleport
    // destinations) across ALL of a player's available months into a
    // density overlay showing where they actually spend the most time -
    // not just the current session's route, the whole known history.
    // Cached per player hash so toggling on/off or switching planes
    // doesn't refetch everything each time.
    let heatmapLayers = []; // one layer per overlaid player, in that player's colour
    let heatmapEnabled = false;

    function hexToRgb(hex) {
      const h = hex.replace("#", "");
      return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
    }
    function mix(hex, target, amt) {
      const a = hexToRgb(hex), b = hexToRgb(target);
      return "rgb(" + a.map((v, i) => Math.round(v + (b[i] - v) * amt)).join(",") + ")";
    }
    // Gradient from a dark tint of the player's colour up to a pale tint,
    // so overlapping players stay distinguishable rather than all going
    // the same yellow-to-red.
    function heatGradientFor(hex) {
      return {
        0.25: mix(hex, "#000000", 0.55),
        0.55: hex,
        0.85: mix(hex, "#ffffff", 0.45),
        1.0: mix(hex, "#ffffff", 0.8)
      };
    }
    const heatmapPointsByHash = {}; // hash -> { plane: [[lat,lng,intensity], ...] }

    // When on, heatmap and fog combine every tracked account rather than
    // just the selected one.
    let overlayAllPlayers = false;

    // Time window for heatmap and fog: 0 = all time, else last N days.
    // Overlay caches are keyed by player AND window so switching back
    // and forth doesn't rebuild.
    const OVERLAY_RANGES = [
      { days: 0, label: "All time" },
      { days: 90, label: "Last 90d" },
      { days: 30, label: "Last 30d" },
      { days: 7, label: "Last 7d" }
    ];
    let overlayRangeIdx = 0;
    function overlayRangeDays() { return OVERLAY_RANGES[overlayRangeIdx].days; }
    function overlayCacheKey(hash) { return hash + "|" + overlayRangeDays(); }
    function sessionsInOverlayRange(sessions) {
      const days = overlayRangeDays();
      if (!days) return sessions;
      const cutoff = Date.now() / 1000 - days * 86400;
      return sessions.filter(s => (s.end || s.start) >= cutoff);
    }
    async function cycleOverlayRange() {
      overlayRangeIdx = (overlayRangeIdx + 1) % OVERLAY_RANGES.length;
      const btn = document.getElementById("overlayRangeBtn");
      if (btn) {
        btn.textContent = OVERLAY_RANGES[overlayRangeIdx].label;
        btn.classList.toggle("active", overlayRangeDays() !== 0);
      }
      if (heatmapEnabled) await refreshHeatmapLayer();
      if (fogEnabled) { await ensureFogData(); redrawFog(); }
    }

    function overlayHashes() {
      if (overlayAllPlayers) return ROUTE_PLAYERS.map(p => p.hash);
      return currentPlayerHash ? [currentPlayerHash] : [];
    }

    // Fetches every available month for this player and buckets every
    // recorded position by plane. Walk waypoints are weighted lower per
    // point than teleport destinations (0.5 vs 1) since a single long walk
    // naturally contributes many points already - this keeps a route
    // that's just passed through once from looking as "hot" as a spot
    // that's genuinely been a real destination many times.
    // Walk events only store corners, so a long straight run is two points
    // with nothing between. Calls fn(x, y) for every point along the path
    // at roughly stepTiles spacing so overlays see the whole route.
    function forEachWalkPoint(ev, stepTiles, fn) {
      const pts = eventGameCoords(ev);
      for (let i = 0; i + 1 < pts.length; i++) {
        const a = pts[i], b = pts[i + 1];
        const dist = Math.hypot(b.x - a.x, b.y - a.y);
        const steps = Math.max(1, Math.ceil(dist / stepTiles));
        for (let st = (i === 0 ? 0 : 1); st <= steps; st++) {
          const t = st / steps;
          fn(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t);
        }
      }
    }

    // Runs fn over every event of every session, yielding to the browser
    // every so often so building an overlay for a year of data doesn't
    // freeze the page.
    async function forEachEventChunked(sessions, fn) {
      const YIELD_EVERY = 150;
      for (let i = 0; i < sessions.length; i++) {
        (sessions[i].events || []).forEach(fn);
        if (i % YIELD_EVERY === YIELD_EVERY - 1) {
          await new Promise(r => setTimeout(r, 0));
        }
      }
    }

    // Positions are summed into a coarse grid before being handed to the
    // heat layer: far fewer points to render, and "hot" then means a cell
    // was visited a lot rather than that a twisty path once left a lot of
    // corners there. Intensity is square-rooted so one heavily camped
    // bank tile doesn't wash out everything else.
    const HEAT_CELL_TILES = 3;
    const HEAT_WALK_STEP_TILES = 2;

    async function buildHeatmapPoints(hash) {
      const sessions = sessionsInOverlayRange(await fetchAllPlayerSessions(hash));
      const cellsByPlane = {}; // plane -> Map("gx,gy" -> summed weight)
      const bump = (plane, x, y, w) => {
        if (!cellsByPlane[plane]) cellsByPlane[plane] = new Map();
        const key = Math.floor(x / HEAT_CELL_TILES) + "," + Math.floor(y / HEAT_CELL_TILES);
        const m = cellsByPlane[plane];
        m.set(key, (m.get(key) || 0) + w);
      };
      await forEachEventChunked(sessions, ev => {
        if (ev.ty === "bank" || !ev.f || !ev.t) return;
        const plane = ev.f[2];
        if (ev.ty === "walk") {
          forEachWalkPoint(ev, HEAT_WALK_STEP_TILES, (x, y) => bump(plane, x, y, 0.5));
        } else {
          bump(plane, ev.t[0], ev.t[1], 1);
        }
      });
      const byPlane = {};
      Object.keys(cellsByPlane).forEach(plane => {
        byPlane[plane] = [];
        cellsByPlane[plane].forEach((w, key) => {
          const [gx, gy] = key.split(",").map(Number);
          const ll = gameToLatLng((gx + 0.5) * HEAT_CELL_TILES, (gy + 0.5) * HEAT_CELL_TILES);
          byPlane[plane].push([ll.lat, ll.lng, Math.sqrt(w)]);
        });
      });
      return byPlane;
    }

    // Rebuilds (or removes) the heatmap layer for whatever player/plane is
    // currently active. Safe to call any time heatmapEnabled might have
    // changed, or after switching player/plane while it's on.
    async function refreshHeatmapLayer() {
      if (!leafletMap) return;
      const clearHeat = () => { heatmapLayers.forEach(l => leafletMap.removeLayer(l)); heatmapLayers = []; };
      if (!heatmapEnabled) { clearHeat(); return; }
      const hashes = overlayHashes();
      if (!hashes.length) return;
      await Promise.all(hashes.map(async h => {
        const k = overlayCacheKey(h);
        if (!heatmapPointsByHash[k]) heatmapPointsByHash[k] = await buildHeatmapPoints(h);
      }));
      clearHeat();
      hashes.forEach(h => {
        const built = heatmapPointsByHash[overlayCacheKey(h)];
        const points = (built && built[currentPlane]) || [];
        if (!points.length) return;
        const player = ROUTE_PLAYERS.find(p => p.hash === h);
        const color = player ? player.color : currentPlayerColor;
        heatmapLayers.push(L.heatLayer(points, {
          radius: 18, blur: 22, maxZoom: MAP_MAX_ZOOM, max: 4,
          minOpacity: 0.15, gradient: heatGradientFor(color)
        }).addTo(leafletMap));
      });
    }

    async function toggleHeatmap() {
      heatmapEnabled = !heatmapEnabled;
      const btn = document.getElementById("heatmapToggleBtn");
      if (btn) btn.classList.toggle("active", heatmapEnabled);
      await refreshHeatmapLayer();
    }

    // ---- Fog of war ----
    //
    // Inverse of the heatmap: instead of showing where a player spends the
    // most time, this shows which parts of the map they've simply never
    // been to at all. Game coordinates are bucketed into a coarse grid
    // (FOG_CELL_TILES per cell) - a cell counts as "explored" if any
    // walk/teleport ever touched it, across every available month.
    //
    // Walk events only store waypoints at turns (see recordMovement in the
    // plugin), so a long straight walk has just two recorded points - that
    // alone would only reveal the start/end cell and miss everything in
    // between. Each leg is interpolated in small steps so the full path
    // gets marked, not just its corners.
    const FOG_CELL_TILES = 6;
    const FOG_COLOR = "rgba(5,7,10,0.82)";
    const exploredCellsByHash = {}; // hash -> { plane: Set("gx,gy") }
    let fogEnabled = false;

    function markFogCell(bucket, gameX, gameY) {
      const gx = Math.floor(gameX / FOG_CELL_TILES);
      const gy = Math.floor(gameY / FOG_CELL_TILES);
      bucket.add(gx + "," + gy);
    }

    async function buildExploredCells(hash) {
      const sessions = sessionsInOverlayRange(await fetchAllPlayerSessions(hash));
      const byPlane = {};
      await forEachEventChunked(sessions, ev => {
        if (ev.ty === "bank" || !ev.f || !ev.t) return;
        const plane = ev.f[2];
        if (!byPlane[plane]) byPlane[plane] = new Set();
        const bucket = byPlane[plane];
        if (ev.ty === "walk") {
          forEachWalkPoint(ev, FOG_CELL_TILES / 2, (x, y) => markFogCell(bucket, x, y));
        } else {
          markFogCell(bucket, ev.t[0], ev.t[1]);
        }
      });
      return byPlane;
    }

    // Redraws the fog canvas for the current viewport: fills it with the
    // fog color, then punches soft transparent holes over every explored
    // cell within (a small margin around) what's actually visible - rather
    // than iterating every cell the player has ever visited, the viewport
    // is converted back to a game-coordinate range via latLngToGame first.
    // Plain full-coverage fill with no holes punched - shown for the
    // duration of a pan/zoom animation, since the real hole positions
    // (computed from screen pixel coordinates at a specific zoom) would be
    // visibly misaligned while the map itself is still animating between
    // zoom levels. Swapped back out for the real redrawFog() once the
    // animation settles.
    // Map centre/zoom the fog holes were last drawn for, so the canvas can
    // be shifted/scaled to track the map while a pan or zoom is in flight.
    let fogDrawnCenter = null;
    let fogDrawnZoom = null;

    function fillSolidFog() {
      const canvas = document.getElementById("fogCanvas");
      const mapDiv = document.getElementById("leafletMap");
      if (!canvas || !mapDiv) return;
      const w = mapDiv.clientWidth, h = mapDiv.clientHeight;
      if (canvas.width !== w) canvas.width = w;
      if (canvas.height !== h) canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.globalCompositeOperation = "source-over";
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = FOG_COLOR;
      ctx.fillRect(0, 0, w, h);
    }

    function redrawFog() {
      if (!fogEnabled || !leafletMap) return;
      const canvas = document.getElementById("fogCanvas");
      const mapDiv = document.getElementById("leafletMap");
      if (!canvas || !mapDiv) return;
      const w = mapDiv.clientWidth, h = mapDiv.clientHeight;
      if (canvas.width !== w) canvas.width = w;
      if (canvas.height !== h) canvas.height = h;
      const ctx = canvas.getContext("2d");
      ctx.globalCompositeOperation = "source-over";
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = FOG_COLOR;
      ctx.fillRect(0, 0, w, h);

      // Union of every overlaid player's explored cells on this plane.
      const cellSets = overlayHashes()
        .map(h => exploredCellsByHash[overlayCacheKey(h)])
        .map(built => built && built[currentPlane])
        .filter(Boolean);
      if (!cellSets.length) return;
      const cells = cellSets.length === 1 ? cellSets[0] : new Set(cellSets.flatMap(st => [...st]));
      if (!cells.size) return;

      // Cell size in screen pixels at the current zoom - this map uses a
      // flat linear projection (see the coordinate-system notes above), so
      // tiles-per-pixel is constant across the whole map at a given zoom,
      // not distorted by "latitude" the way real-world Mercator would be.
      const zoom = leafletMap.getZoom();
      const pxPerTile = RS_TILE_WIDTH_PX * Math.pow(2, zoom - MAP_MAX_ZOOM);
      const cellPx = Math.max(1, FOG_CELL_TILES * pxPerTile);

      const topLeftGame = latLngToGame(leafletMap.containerPointToLatLng([0, 0]));
      const botRightGame = latLngToGame(leafletMap.containerPointToLatLng([w, h]));
      const gx0 = Math.floor(Math.min(topLeftGame.x, botRightGame.x) / FOG_CELL_TILES) - 1;
      const gx1 = Math.floor(Math.max(topLeftGame.x, botRightGame.x) / FOG_CELL_TILES) + 1;
      const gy0 = Math.floor(Math.min(topLeftGame.y, botRightGame.y) / FOG_CELL_TILES) - 1;
      const gy1 = Math.floor(Math.max(topLeftGame.y, botRightGame.y) / FOG_CELL_TILES) + 1;

      ctx.globalCompositeOperation = "destination-out";
      ctx.fillStyle = "rgba(0,0,0,1)";
      const r = cellPx * 0.75;
      // All holes go into one path and are filled once - far cheaper than
      // a fill() per hole when thousands are on screen.
      ctx.beginPath();
      const punch = (gx, gy) => {
        const ll = gameToLatLng((gx + 0.5) * FOG_CELL_TILES, (gy + 0.5) * FOG_CELL_TILES);
        const pt = leafletMap.latLngToContainerPoint(ll);
        ctx.moveTo(pt.x + r, pt.y);
        ctx.arc(pt.x, pt.y, r, 0, Math.PI * 2);
      };
      // Zoomed out, the viewport covers vastly more cells than were ever
      // explored, so walk the explored set and cull to the viewport
      // instead of probing every viewport cell.
      const viewportCells = (gx1 - gx0 + 1) * (gy1 - gy0 + 1);
      if (cells.size < viewportCells) {
        cells.forEach(key => {
          const comma = key.indexOf(",");
          const gx = +key.slice(0, comma), gy = +key.slice(comma + 1);
          if (gx < gx0 || gx > gx1 || gy < gy0 || gy > gy1) return;
          punch(gx, gy);
        });
      } else {
        for (let gx = gx0; gx <= gx1; gx++) {
          for (let gy = gy0; gy <= gy1; gy++) {
            if (cells.has(gx + "," + gy)) punch(gx, gy);
          }
        }
      }
      ctx.fill();
      ctx.globalCompositeOperation = "source-over";

      canvas.style.transform = "";
      fogDrawnCenter = leafletMap.getCenter();
      fogDrawnZoom = zoom;
    }

    // While the map is mid-pan or mid-zoom, shift/scale the last drawn fog
    // canvas so the holes stay glued to the tiles, rather than blanking to
    // solid fog until the move settles. Pure CSS transform, no redraw.
    function trackFogToView(center, zoom) {
      if (!fogEnabled || !leafletMap || !fogDrawnCenter) return;
      const canvas = document.getElementById("fogCanvas");
      if (!canvas) return;
      const size = leafletMap.getSize();
      const scale = leafletMap.getZoomScale(zoom, fogDrawnZoom);
      const drawnCenterPx = leafletMap.project(fogDrawnCenter, fogDrawnZoom);
      const newCenterPx = leafletMap.project(center, zoom);
      // newContainerPt = scale * oldContainerPt + T
      const tx = scale * (drawnCenterPx.x - size.x / 2) - newCenterPx.x + size.x / 2;
      const ty = scale * (drawnCenterPx.y - size.y / 2) - newCenterPx.y + size.y / 2;
      canvas.style.transformOrigin = "0 0";
      canvas.style.transform = "translate(" + tx + "px," + ty + "px) scale(" + scale + ")";
    }

    async function toggleFog() {
      fogEnabled = !fogEnabled;
      const btn = document.getElementById("fogToggleBtn");
      if (btn) btn.classList.toggle("active", fogEnabled);
      const canvas = document.getElementById("fogCanvas");
      if (!fogEnabled) {
        if (canvas) canvas.style.display = "none";
        return;
      }
      if (canvas) canvas.style.display = "block";
      await ensureFogData();
      redrawFog();
    }

    async function ensureFogData() {
      await Promise.all(overlayHashes().map(async h => {
        const k = overlayCacheKey(h);
        if (!exploredCellsByHash[k]) exploredCellsByHash[k] = await buildExploredCells(h);
      }));
    }

    async function toggleOverlayAll() {
      overlayAllPlayers = !overlayAllPlayers;
      const btn = document.getElementById("overlayAllBtn");
      if (btn) btn.classList.toggle("active", overlayAllPlayers);
      if (heatmapEnabled) await refreshHeatmapLayer();
      if (fogEnabled) { await ensureFogData(); redrawFog(); }
    }

    function switchPlane(plane) {
      if (!leafletMap || !planeTileLayer || plane === currentPlane) return;
      currentPlane = plane;
      planeTileLayer.setUrl(tileUrlTemplate(currentPlane));
      renderPlaneButtons();
      const sessionSelect = document.getElementById("sessionSelect");
      const idx = sessionSelect ? parseInt(sessionSelect.value, 10) : NaN;
      if (activePlayback) activePlayback.redrawTrail();
      else if (!isNaN(idx) && currentSessions[idx]) renderSessionPath([currentSessions[idx]]);
      if (heatmapEnabled) refreshHeatmapLayer();
      if (fogEnabled) redrawFog();
    }

    function renderPlaneButtons() {
      document.querySelectorAll(".plane-btn").forEach(btn => {
        btn.classList.toggle("active", parseInt(btn.dataset.plane, 10) === currentPlane);
      });
    }

    function initPlaneControl() {
      const container = document.getElementById("planeControl");
      if (!container) return;
      container.innerHTML = "";
      [0, 1, 2, 3].forEach(p => {
        const btn = document.createElement("button");
        btn.className = "tab-btn plane-btn";
        btn.dataset.plane = p;
        btn.textContent = p;
        btn.title = p === 0 ? "Ground floor" : "Floor " + p;
        btn.addEventListener("click", () => switchPlane(p));
        container.appendChild(btn);
      });
      renderPlaneButtons();
    }

    function eventLatLngs(ev) {
      const pts = [gameToLatLng(ev.f[0], ev.f[1])];
      if (ev.ty === "walk" && Array.isArray(ev.w)) {
        for (let i = 0; i + 1 < ev.w.length; i += 2) {
          pts.push(gameToLatLng(ev.w[i], ev.w[i + 1]));
        }
      }
      pts.push(gameToLatLng(ev.t[0], ev.t[1]));
      return pts;
    }

    function eventGameCoords(ev) {
      const pts = [{ x: ev.f[0], y: ev.f[1] }];
      if (ev.ty === "walk" && Array.isArray(ev.w)) {
        for (let i = 0; i + 1 < ev.w.length; i += 2) {
          pts.push({ x: ev.w[i], y: ev.w[i + 1] });
        }
      }
      pts.push({ x: ev.t[0], y: ev.t[1] });
      return pts;
    }

    // Run state for each leg of a walk event, aligned with the leg list
    // from eventLatLngs (leg i runs from point i to point i+1). r holds
    // one entry per point (state on arrival), rAll a single value for the
    // whole segment, and old data has neither.
    function walkLegRunStates(ev) {
      const pointCount = 2 + (Array.isArray(ev.w) ? ev.w.length / 2 : 0);
      const legs = pointCount - 1;
      if (Array.isArray(ev.r) && ev.r.length === pointCount) {
        return ev.r.slice(1); // arrival state at the end of each leg
      }
      const single = typeof ev.rAll === "number" ? ev.rAll : null;
      return new Array(legs).fill(single);
    }

    function legStyle(run, boat) {
      const running = run === 1;
      const unknown = run === null || run === undefined;
      return {
        color: currentPlayerColor,
        weight: running ? 3.5 : 2.5,
        opacity: unknown ? 0.75 : (running ? 0.95 : 0.45),
        dashArray: boat ? "6 6" : null,
        lineJoin: "round",
        lineCap: "round"
      };
    }

    // The drawn route uses the player's own colour, muted while walking
    // and vivid while running, so the two states are distinguishable
    // without a second hue that would clash with other players' colours.
    // Boat travel is dashed.
    function renderSessionPath(sessions) {
      if (!routeLayerGroup) return;
      routeLayerGroup.clearLayers();

      sessions.forEach(session => {
        session.events.forEach(ev => {
          if (ev.ty !== "walk" || !ev.f || !ev.t) return;
          if (ev.f[2] !== currentPlane) return;
          const pts = eventLatLngs(ev);
          const runs = walkLegRunStates(ev);
          const boat = ev.b === 1;

          // Merge consecutive legs with the same state into one polyline
          // so a long run isn't hundreds of tiny layers.
          let i = 0;
          while (i + 1 < pts.length) {
            const state = runs[i];
            const latlngs = [pts[i]];
            let j = i;
            while (j + 1 < pts.length && runs[j] === state) { latlngs.push(pts[j + 1]); j++; }
            L.polyline(latlngs, legStyle(state, boat)).addTo(routeLayerGroup);
            i = j;
          }
        });
      });
    }

    let playbackAnimationId = null;
    let activePlayback = null;
    let lastFrameTime = null;
    let playbackMarker = null;
    let playbackHalo = null;

    const TELEPORT_FLASH_MIN_MS = 220;
    const TELEPORT_FLASH_MAX_MS = 800;

    function findSegmentIndex(segments, frac) {
      for (let i = 0; i < segments.length; i++) {
        if (frac >= segments[i].startFrac && frac < segments[i].endFrac) return i;
      }
      return segments.length - 1;
    }

    function playTeleportFlash(latlng) {
      if (!leafletMap) return;
      const start = performance.now();
      const ring = L.circleMarker(latlng, {
        radius: 6, color: "#fff", weight: 2, fillColor: "#8ecbff", fillOpacity: 0.6
      }).addTo(leafletMap);
      function tick(now) {
        const t = Math.min(1, (now - start) / TELEPORT_FLASH_MIN_MS);
        ring.setRadius(6 + t * 22);
        ring.setStyle({ opacity: 1 - t, fillOpacity: 0.6 * (1 - t) });
        if (t < 1) {
          requestAnimationFrame(tick);
        } else {
          leafletMap.removeLayer(ring);
        }
      }
      requestAnimationFrame(tick);
    }

    // Playback speed multiplier, cycled by the speed button.
    const PLAYBACK_SPEEDS = [1, 2, 4];
    let playbackSpeed = 1;
    function cyclePlaybackSpeed() {
      const i = PLAYBACK_SPEEDS.indexOf(playbackSpeed);
      playbackSpeed = PLAYBACK_SPEEDS[(i + 1) % PLAYBACK_SPEEDS.length];
      const btn = document.getElementById("speedBtn");
      if (btn) btn.textContent = playbackSpeed + "x";
    }

    // The frame loop only runs while something is actually playing. It
    // stops itself when playback pauses or finishes, and anything that
    // starts playback calls ensureTickerRunning() to bring it back.
    let tickerRunning = false;
    function ensureTickerRunning() {
      if (tickerRunning) return;
      tickerRunning = true;
      lastFrameTime = null;
      requestAnimationFrame(globalPlaybackTick);
    }

    function globalPlaybackTick(now) {
      if (!activePlayback || activePlayback.paused) {
        tickerRunning = false;
        return;
      }
      if (lastFrameTime === null) lastFrameTime = now;
      const dt = (now - lastFrameTime) * playbackSpeed;
      lastFrameTime = now;

      {
        if (activePlayback.flashing) {
          const elapsed = now - activePlayback.flashStart;
          const urls = activePlayback.flashTileUrls;
          const tilesReady = !!urls && urls.every(u => loadedTileUrls.has(u));
          if (elapsed >= TELEPORT_FLASH_MIN_MS && (tilesReady || elapsed >= TELEPORT_FLASH_MAX_MS)) {
            activePlayback.flashing = false;
          }
        } else {
          const prospectiveMs = Math.min(
            activePlayback.PLAYBACK_MS,
            activePlayback.elapsedMs + dt
          );
          const prospectiveFrac = prospectiveMs / activePlayback.PLAYBACK_MS;
          const idx = findSegmentIndex(activePlayback.segments, prospectiveFrac);
          const enteringNewTeleport =
            idx !== activePlayback.lastAnnouncedSegIndex &&
            activePlayback.lastAnnouncedSegIndex !== -1 &&
            activePlayback.segments[idx].snap;

          if (enteringNewTeleport) {
            activePlayback.elapsedMs = prospectiveMs;
            activePlayback.lastAnnouncedSegIndex = idx;
            activePlayback.flashing = true;
            activePlayback.flashStart = now;
            activePlayback.flashTileUrls = activePlayback.segments[idx].tileUrls;
            playTeleportFlash(playbackMarker.getLatLng());
          } else {
            activePlayback.elapsedMs = prospectiveMs;
            activePlayback.lastAnnouncedSegIndex = idx;
            activePlayback.seekTo(prospectiveFrac, false);
            activePlayback.fireCuesUpTo(prospectiveMs);
            if (playbackHalo) {
              playbackHalo.setRadius(9 + Math.sin(activePlayback.elapsedMs / 180) * 3);
            }
            if (prospectiveFrac >= 1) {
              activePlayback.paused = true;
              setPlayButtonIcon(true);
              activePlayback.onComplete();
            }
          }
        }
      }
      requestAnimationFrame(globalPlaybackTick);
    }

    function setPlayButtonIcon(showPlay) {
      const btn = document.getElementById("sessionPlayBtn");
      if (btn) btn.textContent = showPlay ? "▶" : "⏸";
    }

    // OSRS skill colours (approximate, for xp drops and the HUD).
    const SKILL_COLORS = {
      Attack: "#b83b2a", Strength: "#2e9e4f", Defence: "#4a90e2", Ranged: "#3a9d5d",
      Prayer: "#e8e0b0", Magic: "#3f6be0", Runecrafting: "#c9c1a4", Construction: "#c8a26b",
      Hitpoints: "#e0534c", Agility: "#3f3fb0", Herblore: "#2f9e5c", Thieving: "#7b4fb0",
      Crafting: "#a6743a", Fletching: "#3cb8b0", Slayer: "#a04040", Hunter: "#8a7050",
      Mining: "#6f7b8a", Smithing: "#8f8f8f", Fishing: "#4a8fbd", Cooking: "#8a3ab5",
      Firemaking: "#e08a2c", Woodcutting: "#7d9a4a", Farming: "#5aab3a", Sailing: "#3a7fbf"
    };
    function skillColor(name) { return SKILL_COLORS[name] || "#d0d6de"; }

    // ---- Effects layer helpers ----
    function fxContainer() { return document.getElementById("mapFx"); }
    function markerScreenPoint() {
      if (!leafletMap || !playbackMarker) return null;
      return leafletMap.latLngToContainerPoint(playbackMarker.getLatLng());
    }
    function spawnFx(className, html, dx, dy, ttlMs) {
      const box = fxContainer();
      const pt = markerScreenPoint();
      if (!box || !pt) return;
      const el = document.createElement("div");
      el.className = className;
      el.innerHTML = html;
      el.style.left = (pt.x + dx) + "px";
      el.style.top = (pt.y + dy) + "px";
      box.appendChild(el);
      setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, ttlMs);
    }
    function spawnXpDrop(skill, amount, stackIndex) {
      spawnFx("fx-xp",
        '<span style="color:' + skillColor(skill) + '">+' + fmt(amount) + '</span>' +
        '<span class="fx-skill" style="color:' + skillColor(skill) + '">' + esc(skill) + '</span>',
        (stackIndex % 2 === 0 ? -1 : 1) * (14 + stackIndex * 6), -14 - stackIndex * 16, 1700);
    }
    function spawnHitsplat(delta) {
      const cls = delta < 0 ? "dmg" : (delta > 0 ? "heal" : "zero");
      spawnFx("fx-split " + cls, String(Math.abs(delta)), 0, 0, 1200);
    }

    // ---- Marker HP bar + HUD ----
    let fxHpBar = null;
    let hudHideTimer = null;
    function ensureFxHpBar() {
      if (fxHpBar) return fxHpBar;
      const box = fxContainer();
      if (!box) return null;
      fxHpBar = document.createElement("div");
      fxHpBar.className = "fx-hpbar";
      fxHpBar.style.opacity = "0";
      fxHpBar.innerHTML = "<div></div>";
      box.appendChild(fxHpBar);
      return fxHpBar;
    }
    function positionFxHpBar() {
      if (!fxHpBar) return;
      const pt = markerScreenPoint();
      if (!pt) return;
      fxHpBar.style.left = pt.x + "px";
      fxHpBar.style.top = (pt.y - 20) + "px";
    }
    function hpColor(frac) {
      // green above 50%, amber to 25%, red below
      if (frac > 0.5) return "#2ecc71";
      if (frac > 0.25) return "#f0b429";
      return "#e74c3c";
    }
    function renderHud(state, phase) {
      const hud = document.getElementById("sessionHud");
      if (!hud) return;
      hud.style.display = "block";
      const player = ROUTE_PLAYERS.find(p => p.hash === currentPlayerHash);
      const nameEl = document.getElementById("hudPlayer");
      if (nameEl) {
        nameEl.textContent = player ? player.name : "";
        nameEl.style.color = currentPlayerColor;
      }
      const phaseEl = document.getElementById("hudPhase");
      if (phaseEl) phaseEl.textContent = phase || "";

      const hpRow = document.getElementById("hudHpRow");
      if (hpRow) {
        if (state.hasHp && state.hpMax > 0) {
          hpRow.style.display = "flex";
          const frac = Math.max(0, Math.min(1, state.hp / state.hpMax));
          const fill = document.getElementById("hudHpFill");
          if (fill) { fill.style.width = (frac * 100) + "%"; fill.style.background = hpColor(frac); }
          const num = document.getElementById("hudHpNum");
          if (num) num.textContent = state.hp + " / " + state.hpMax;
          const bar = ensureFxHpBar();
          if (bar) {
            bar.firstChild.style.width = (frac * 100) + "%";
            bar.firstChild.style.background = hpColor(frac);
            bar.style.opacity = state.hp < state.hpMax ? "1" : "0";
          }
        } else {
          hpRow.style.display = "none";
          if (fxHpBar) fxHpBar.style.opacity = "0";
        }
      }

      const xpRow = document.getElementById("hudXpRow");
      if (xpRow) {
        const skills = Object.keys(state.xp);
        if (skills.length) {
          xpRow.style.display = "block";
          const total = skills.reduce((a, k) => a + state.xp[k], 0);
          const totalEl = document.getElementById("hudXpTotal");
          if (totalEl) totalEl.textContent = fmt(total);
          const list = document.getElementById("hudSkills");
          if (list) {
            list.innerHTML = skills
              .sort((a, b) => state.xp[b] - state.xp[a])
              .slice(0, 5)
              .map(k => '<span class="sk" style="color:' + skillColor(k) + '">' + esc(k) + '</span>' +
                        '<span class="sv">' + fmt(state.xp[k]) + '</span>')
              .join("");
          }
        } else {
          xpRow.style.display = "none";
        }
      }
    }
    // ---- Nightly summaries (written by the session-summaries workflow) ----
    const summaryCache = {}; // hash|day -> object or null
    async function fetchDaySummary(hash, day) {
      const key = hash + "|" + day;
      if (key in summaryCache) return summaryCache[key];
      let data = null;
      try {
        const res = await fetch("route-data/" + hash + "/summaries/" + day + ".json", { cache: "no-store" });
        if (res.ok) data = await res.json();
      } catch (err) { /* none for this day */ }
      summaryCache[key] = data;
      return data;
    }
    async function showSessionSummary(session) {
      const el = document.getElementById("hudSummary");
      if (!el) return;
      el.style.display = "none";
      if (!session || !currentPlayerHash) return;
      const day = new Date(session.start * 1000).toISOString().slice(0, 10);
      const data = await fetchDaySummary(currentPlayerHash, day);
      if (!data || !activePlayback || activePlayback.sessionId !== session.id) return;
      const line = data.sessions && data.sessions[session.id];
      el.innerHTML =
        (line ? '<div class="hud-sum-day">' + esc(line) + '</div>' : "") +
        '<div>' + esc(data.summary || "") + '</div>' +
        '<div class="hud-sum-src">Day recap' + (data.source === "template" ? "" : ", AI") + '</div>';
      el.style.display = "block";
    }

    function hideHud() {
      const hud = document.getElementById("sessionHud");
      if (hud) hud.style.display = "none";
      const sum = document.getElementById("hudSummary");
      if (sum) sum.style.display = "none";
      if (fxHpBar) fxHpBar.style.opacity = "0";
      const box = fxContainer();
      if (box) Array.from(box.querySelectorAll(".fx-xp, .fx-split")).forEach(el => el.remove());
    }

    function loadSessionForPlayback(session) {
      initLeafletMap();
      const statusEl = document.getElementById("sessionStatus");
      const scrubber = document.getElementById("sessionScrubber");
      activePlayback = null;
      hideHud();
      const ticksBox = document.getElementById("scrubTicks");
      if (ticksBox) ticksBox.innerHTML = "";
      if (!session || !session.events || !session.events.length) {
        if (statusEl) statusEl.textContent = "No events";
        return;
      }

      if (playbackMarker) { leafletMap.removeLayer(playbackMarker); playbackMarker = null; }
      if (playbackHalo) { leafletMap.removeLayer(playbackHalo); playbackHalo = null; }

      playbackHalo = L.circleMarker([0, 0], {
        radius: 9, color: "none", fillColor: currentPlayerColor, fillOpacity: 0.25
      }).addTo(leafletMap);
      playbackMarker = L.circleMarker([0, 0], {
        radius: 6, color: "#fff", weight: 2, fillColor: currentPlayerColor, fillOpacity: 1
      }).addTo(leafletMap);

      const FOLLOW_ZOOM = 8;
      const MS_PER_TILE = 90;         // walk legs play at constant tile speed
      const TP_DURATION_MS = 150;     // the beat a teleport cut occupies
      const IDLE_MIN_GAP_SEC = 8;     // gaps shorter than this are absorbed
      const IDLE_MS_PER_SQRT_SEC = 400; // idle playback = 400ms * sqrt(gap seconds)
      const IDLE_MAX_MS = 20000;      // a multi-hour AFK still tops out here

      // Every event with a timestamp, in time order. File order is flush
      // order, which is not the same thing (xp/hp events are written at
      // save time, after the walks they overlap).
      const events = session.events
        .filter(ev => ev && typeof ev.s === "number")
        .slice()
        .sort((a, b) => a.s - b.s);
      if (!events.length) {
        if (statusEl) statusEl.textContent = "No valid events";
        return;
      }
      const positional = events.filter(ev => Array.isArray(ev.t) && ev.t.length >= 2 &&
        (ev.ty === "walk" ? Array.isArray(ev.f) && ev.f.length >= 2 : true));

      const t0 = session.start || events[0].s;
      let tLast = t0;
      events.forEach(ev => { tLast = Math.max(tLast, ev.e != null ? ev.e : ev.s); });
      const t1 = Math.max(t0 + 1, session.end != null ? Math.max(session.end, tLast) : tLast);

      // ---- Build the timeline ----
      // Segment shapes:
      //   walk : marker moves from -> to at tile speed
      //   tp   : instant cut after the flash beat (also used for implicit
      //          cuts, e.g. a walk that starts somewhere other than where
      //          the previous one ended - a boat trip the plugin missed)
      //   idle : marker holds still while the clock runs, gap compressed
      const rawSegments = [];
      let lastPos = null;      // {latlng, plane, game:{x,y}}
      let lastRealEnd = t0;

      function pushIdleIfGap(nextStart, at) {
        if (!at) return;
        const gap = nextStart - lastRealEnd;
        if (gap < IDLE_MIN_GAP_SEC) return;
        rawSegments.push({
          type: "idle", from: at.latlng, to: at.latlng, plane: at.plane,
          durationMs: Math.min(IDLE_MAX_MS, IDLE_MS_PER_SQRT_SEC * Math.sqrt(gap)),
          realFrom: lastRealEnd, realTo: nextStart, inst: at.inst, boat: at.boat
        });
      }

      positional.forEach(ev => {
        const inst = ev.i === 1, boat = ev.b === 1;
        if (ev.ty === "walk" || ev.ty === "tp") {
          const evStart = ev.s;
          const evEnd = ev.ty === "walk" ? (ev.e != null ? ev.e : ev.s) : ev.s;
          const fromGame = { x: ev.f[0], y: ev.f[1] };
          const fromLL = gameToLatLng(ev.f[0], ev.f[1]);

          // Implicit cut when this event doesn't start where we last were.
          if (lastPos && (lastPos.game.x !== fromGame.x || lastPos.game.y !== fromGame.y ||
              lastPos.plane !== ev.f[2])) {
            pushIdleIfGap(evStart, lastPos);
            rawSegments.push({
              type: "tp", from: lastPos.latlng, to: fromLL, plane: ev.f[2],
              durationMs: TP_DURATION_MS, realFrom: evStart, realTo: evStart,
              inst, boat, implicit: true
            });
          } else {
            pushIdleIfGap(evStart, lastPos);
          }

          if (ev.ty === "tp") {
            rawSegments.push({
              type: "tp", from: fromLL, to: gameToLatLng(ev.t[0], ev.t[1]), plane: ev.t[2],
              durationMs: TP_DURATION_MS, realFrom: evStart, realTo: evStart, inst, boat,
              label: ev.lbl || null
            });
          } else {
            const pts = eventLatLngs(ev);
            const gamePts = eventGameCoords(ev);
            const runs = walkLegRunStates(ev);
            const legLens = [];
            let total = 0;
            for (let i = 0; i + 1 < gamePts.length; i++) {
              const len = Math.max(0.0001, Math.hypot(
                gamePts[i + 1].x - gamePts[i].x, gamePts[i + 1].y - gamePts[i].y));
              legLens.push(len); total += len;
            }
            let cum = 0;
            for (let i = 0; i + 1 < pts.length; i++) {
              const before = cum; cum += legLens[i];
              rawSegments.push({
                type: "walk", from: pts[i], to: pts[i + 1], plane: ev.t[2],
                durationMs: legLens[i] * MS_PER_TILE,
                realFrom: evStart + (evEnd - evStart) * (before / total),
                realTo: evStart + (evEnd - evStart) * (cum / total),
                run: runs[i], inst, boat
              });
            }
          }
          lastPos = { latlng: gameToLatLng(ev.t[0], ev.t[1]), plane: ev.t[2],
            game: { x: ev.t[0], y: ev.t[1] }, inst, boat };
          lastRealEnd = Math.max(lastRealEnd, evEnd);
        } else if (!lastPos) {
          // Session opened with a stationary event (xp/hp/bank) - it tells
          // us where the player is, even though nothing moved yet.
          lastPos = { latlng: gameToLatLng(ev.t[0], ev.t[1]), plane: ev.t[2],
            game: { x: ev.t[0], y: ev.t[1] }, inst, boat };
          lastRealEnd = ev.s;
        }
      });

      // Trailing idle so the session's real end is reachable on the clock.
      if (lastPos && t1 - lastRealEnd >= IDLE_MIN_GAP_SEC) pushIdleIfGap(t1, lastPos);

      if (!rawSegments.length) {
        // Nothing moved at all: a single idle segment for the whole session.
        const at = lastPos || (positional[0] && {
          latlng: gameToLatLng(positional[0].t[0], positional[0].t[1]), plane: positional[0].t[2]
        });
        if (!at) { if (statusEl) statusEl.textContent = "No valid events"; return; }
        rawSegments.push({
          type: "idle", from: at.latlng, to: at.latlng, plane: at.plane,
          durationMs: Math.min(IDLE_MAX_MS, IDLE_MS_PER_SQRT_SEC * Math.sqrt(Math.max(1, t1 - t0))),
          realFrom: t0, realTo: t1
        });
      }

      const PLAYBACK_MS = Math.max(1, rawSegments.reduce((a, s) => a + s.durationMs, 0));
      let cumMs = 0;
      const segments = rawSegments.map(r => {
        const startMs = cumMs;
        cumMs += r.durationMs;
        return Object.assign({}, r, {
          startMs, endMs: cumMs,
          startFrac: startMs / PLAYBACK_MS, endFrac: cumMs / PLAYBACK_MS,
          isWalk: r.type === "walk",
          snap: r.type === "tp",
          tileUrls: null
        });
      });

      // Real session time -> playback ms. Within a segment interpolate
      // its real span; between segments (a gap too short to get an idle
      // segment) clamp to the boundary.
      function realToPlaybackMs(t) {
        if (t <= segments[0].realFrom) return 0;
        for (let i = 0; i < segments.length; i++) {
          const sg = segments[i];
          if (t >= sg.realFrom && t <= sg.realTo) {
            const span = sg.realTo - sg.realFrom;
            const f = span > 0 ? (t - sg.realFrom) / span : 1;
            return sg.startMs + (sg.endMs - sg.startMs) * f;
          }
          if (t < sg.realFrom) return sg.startMs; // fell in an absorbed gap
        }
        return PLAYBACK_MS;
      }

      // ---- Cues: things that happen at a moment (xp drops, hp changes) ----
      const cues = [];
      let hasHp = false;
      events.forEach(ev => {
        if (ev.ty === "xp" && Array.isArray(ev.d) && Array.isArray(ev.sk)) {
          // 1.2 format: one cue per drop, at the second it landed.
          for (let i = 0; i + 2 < ev.d.length; i += 3) {
            const skill = ev.sk[ev.d[i + 1]];
            if (!skill) continue;
            const gains = {}; gains[skill] = ev.d[i + 2];
            cues.push({ ms: realToPlaybackMs(ev.s + ev.d[i]), type: "xp", gains });
          }
        } else if (ev.ty === "xp" && ev.xp) {
          // 1.1 format: per-skill totals stamped at save time.
          cues.push({ ms: realToPlaybackMs(ev.s), type: "xp", gains: ev.xp });
        } else if (ev.ty === "hp" && Array.isArray(ev.hp)) {
          hasHp = true;
          for (let i = 0; i + 1 < ev.hp.length; i += 2) {
            cues.push({ ms: realToPlaybackMs(ev.s + ev.hp[i]), type: "hp", value: ev.hp[i + 1], max: ev.mx || 0 });
          }
        }
      });
      cues.forEach((c, i) => { c.order = i; });
      cues.sort((a, b) => (a.ms - b.ms) || (a.order - b.order));

      const hudState = { hp: 0, hpMax: 0, hasHp, xp: {} };
      let cueIdx = 0;
      let announcedComplete = false;

      function applyCue(c, animate) {
        if (c.type === "xp") {
          let k = 0;
          Object.keys(c.gains).forEach(skill => {
            hudState.xp[skill] = (hudState.xp[skill] || 0) + c.gains[skill];
            if (animate) spawnXpDrop(skill, c.gains[skill], k++);
          });
        } else if (c.type === "hp") {
          const prev = hudState.hpMax ? hudState.hp : null;
          if (c.max) hudState.hpMax = c.max;
          hudState.hp = c.value;
          if (animate && prev !== null) {
            const delta = c.value - prev;
            // Regen ticks and other 1-point changes stay quiet; the bar
            // still updates. Anything bigger gets a splat.
            if (Math.abs(delta) >= 2) spawnHitsplat(delta);
          }
        }
      }
      // Rebuild HUD state from scratch up to a playback time (scrub/step).
      function syncCuesTo(ms) {
        hudState.hp = 0; hudState.hpMax = 0; hudState.xp = {};
        cueIdx = 0;
        while (cueIdx < cues.length && cues[cueIdx].ms <= ms) { applyCue(cues[cueIdx], false); cueIdx++; }
        if (!hudState.hpMax && hasHp) {
          // Before the first hp sample the player is assumed full.
          const firstHp = cues.find(c => c.type === "hp");
          if (firstHp && firstHp.max) { hudState.hpMax = firstHp.max; hudState.hp = firstHp.max; }
        }
        renderHud(hudState, ms >= PLAYBACK_MS ? "complete" : "");
      }
      // Fire cues crossed since the last frame (normal playback).
      function fireCuesUpTo(ms) {
        let fired = false;
        while (cueIdx < cues.length && cues[cueIdx].ms <= ms) { applyCue(cues[cueIdx], true); cueIdx++; fired = true; }
        if (fired) renderHud(hudState, "");
      }
      function onComplete() {
        if (announcedComplete) return;
        announcedComplete = true;
        renderHud(hudState, "complete");
        const hud = document.getElementById("sessionHud");
        if (hud) { hud.classList.remove("hud-complete"); void hud.offsetWidth; hud.classList.add("hud-complete"); }
      }

      // ---- Prefetch (unchanged in spirit) ----
      const TELEPORT_LOOKAHEAD = 2;
      let lastLookaheadIdx = -1;
      function prefetchUpcomingTeleports(fromIdx) {
        if (fromIdx === lastLookaheadIdx) return;
        lastLookaheadIdx = fromIdx;
        let found = 0;
        for (let i = fromIdx; i < segments.length && found < TELEPORT_LOOKAHEAD; i++) {
          const seg = segments[i];
          if (!seg.snap) continue;
          found++;
          if (seg.tileUrls === null) {
            seg.tileUrls = preloadTeleportDestination(seg.to, FOLLOW_ZOOM,
              typeof seg.plane === "number" ? seg.plane : currentPlane);
          }
        }
      }
      prefetchUpcomingTeleports(0);

      const ROUTE_AHEAD_MS = 10000;
      const ROUTE_AHEAD_EVERY_MS = 1500;
      let lastRouteAheadAt = 0;
      function prefetchRouteAhead(frac) {
        const nowMs = performance.now();
        if (nowMs - lastRouteAheadAt < ROUTE_AHEAD_EVERY_MS || !leafletMap) return;
        lastRouteAheadAt = nowMs;
        const zoom = Math.round(leafletMap.getZoom());
        const targetFrac = Math.min(1, frac + (ROUTE_AHEAD_MS * playbackSpeed) / PLAYBACK_MS);
        for (let i = findSegmentIndex(segments, frac); i < segments.length; i++) {
          const seg = segments[i];
          if (seg.startFrac > targetFrac) break;
          if (!seg.isWalk) continue;
          const plane = typeof seg.plane === "number" ? seg.plane : currentPlane;
          [0, 0.5, 1].forEach(t => {
            const ll = L.latLng(
              seg.from.lat + (seg.to.lat - seg.from.lat) * t,
              seg.from.lng + (seg.to.lng - seg.from.lng) * t);
            preloadTilesAround(ll, zoom, 1, "low", plane);
          });
        }
      }

      // ---- Trail: only the part of the route already travelled is drawn ----
      // Completed walk legs are appended as playback advances; scrubbing
      // backwards or switching plane rebuilds from scratch. The leg in
      // progress is a separate line that follows the marker.
      let trailUpTo = 0;
      let trailPlane = currentPlane;
      const currentLegLine = L.polyline([], legStyle(null, false)).addTo(routeLayerGroup);
      function trailAppend(toIdx) {
        for (let i = trailUpTo; i < toIdx; i++) {
          const sg = segments[i];
          if (sg.isWalk && sg.plane === currentPlane) {
            L.polyline([sg.from, sg.to], legStyle(sg.run, sg.boat)).addTo(routeLayerGroup);
          }
        }
        trailUpTo = Math.max(trailUpTo, toIdx);
      }
      function trailRebuild(toIdx) {
        routeLayerGroup.clearLayers();
        currentLegLine.setLatLngs([]);
        currentLegLine.addTo(routeLayerGroup);
        trailUpTo = 0;
        trailPlane = currentPlane;
        trailAppend(toIdx);
      }
      function updateTrail(idx, seg, latlng) {
        if (idx < trailUpTo || trailPlane !== currentPlane) trailRebuild(idx);
        else trailAppend(idx);
        if (seg.isWalk && seg.plane === currentPlane) {
          currentLegLine.setStyle(legStyle(seg.run, seg.boat));
          currentLegLine.setLatLngs([seg.from, latlng]);
        } else {
          currentLegLine.setLatLngs([]);
        }
      }
      routeLayerGroup.clearLayers();
      currentLegLine.addTo(routeLayerGroup);

      function seekTo(frac, snapCamera) {
        frac = Math.min(1, Math.max(0, frac));
        const idx = findSegmentIndex(segments, frac);
        const seg = segments[idx];
        prefetchUpcomingTeleports(idx);
        if (activePlayback && !activePlayback.paused) prefetchRouteAhead(frac);
        const segFrac = Math.min(1, Math.max(0,
          (frac - seg.startFrac) / Math.max(0.0001, seg.endFrac - seg.startFrac)));
        const lat = seg.from.lat + (seg.to.lat - seg.from.lat) * segFrac;
        const lng = seg.from.lng + (seg.to.lng - seg.from.lng) * segFrac;
        const latlng = L.latLng(lat, lng);

        if (typeof seg.plane === "number" && seg.plane !== currentPlane) {
          switchPlane(seg.plane);
        }

        playbackMarker.setLatLng(latlng);
        playbackHalo.setLatLng(latlng);
        updateTrail(idx, seg, latlng);

        const shouldSnap = snapCamera || seg.snap;
        if (shouldSnap) {
          leafletMap.setView(latlng, Math.max(leafletMap.getZoom(), FOLLOW_ZOOM), { animate: false });
        } else if (seg.isWalk) {
          leafletMap.panTo(latlng, { animate: true, duration: 0.15, easeLinearity: 1 });
        }
        positionFxHpBar();

        const realTime = seg.realFrom + (seg.realTo - seg.realFrom) * segFrac;
        if (statusEl && !statusEl.dataset.outage) {
          const idleTag = seg.type === "idle" ? "  (idle)" : "";
          statusEl.textContent = formatDuration(realTime - t0) + " / " + formatDuration(t1 - t0) + idleTag;
        }
        if (scrubber) scrubber.value = Math.round(frac * 1000);
        updateInstanceBanner();

        // Scrubs and steps rebuild HUD state; frame-by-frame playback fires
        // cues incrementally from the tick loop instead.
        if (snapCamera) syncCuesTo(frac * PLAYBACK_MS);
      }

      activePlayback = {
        sessionId: session.id,
        PLAYBACK_MS, seekTo, segments, cues, elapsedMs: 0, paused: true,
        lastAnnouncedSegIndex: -1, flashing: false,
        fireCuesUpTo, syncCuesTo, onComplete,
        resetCues: () => { announcedComplete = false; syncCuesTo(0); },
        redrawTrail: () => {
          const idx = findSegmentIndex(segments, activePlayback.elapsedMs / PLAYBACK_MS);
          trailRebuild(idx);
          updateTrail(idx, segments[idx], playbackMarker.getLatLng());
        }
      };
      seekTo(0, true);
      activePlayback.lastAnnouncedSegIndex = findSegmentIndex(segments, 0);
      setPlayButtonIcon(true);
      renderScrubTicks(segments, cues, PLAYBACK_MS, events);
      const selIdx = currentSessions.indexOf(session);
      if (selIdx >= 0) setActiveSessionPill(selIdx);
      showSessionSummary(session);
    }

    function playPause() {
      if (!activePlayback) return;
      if (activePlayback.elapsedMs >= activePlayback.PLAYBACK_MS) {
        activePlayback.elapsedMs = 0;
        activePlayback.lastAnnouncedSegIndex = findSegmentIndex(activePlayback.segments, 0);
        activePlayback.flashing = false;
        activePlayback.resetCues();
      }
      activePlayback.paused = !activePlayback.paused;
      lastFrameTime = null;
      setPlayButtonIcon(activePlayback.paused);
      if (!activePlayback.paused) ensureTickerRunning();
    }

    function stepFrame(direction) {
      if (!activePlayback) return;
      activePlayback.paused = true;
      activePlayback.flashing = false;
      setPlayButtonIcon(true);
      const targetIndex = Math.min(
        activePlayback.segments.length - 1,
        Math.max(0, findSegmentIndex(activePlayback.segments,
          activePlayback.elapsedMs / activePlayback.PLAYBACK_MS) + direction)
      );
      const segs = activePlayback.segments;
      const targetFrac = direction > 0 ? segs[targetIndex].endFrac : segs[targetIndex].startFrac;
      activePlayback.elapsedMs = targetFrac * activePlayback.PLAYBACK_MS;
      activePlayback.lastAnnouncedSegIndex = targetIndex;
      activePlayback.seekTo(targetFrac, true);
    }

    function playSession(session) {
      loadSessionForPlayback(session);
      if (activePlayback) {
        activePlayback.paused = false;
        lastFrameTime = null;
        setPlayButtonIcon(false);
        ensureTickerRunning();
      }
    }

    let currentSessions = [];
    let currentPlayerColor = "#ff3b3b";
    let currentPlayerHash = "";

    async function loadAndRenderPlayer(hash) {
      const months = await fetchAvailableMonths(hash);
      populateMonthSelect(months);
      const defaultMonth = months.length ? months[0] : currentYearMonth();
      await loadSessionsForMonth(hash, defaultMonth);
    }

    function setSessionStatus(text) {
      const el = document.getElementById("sessionStatus");
      if (el) el.textContent = text;
    }

    async function loadSessionsForMonth(hash, yearMonth) {
      currentSessions = await fetchPlayerSessions(hash, yearMonth);
      populateSessionSelect(currentSessions);
      if (!currentSessions.length) setSessionStatus("No route data for this month");
    }

    function loadSelectedSession() {
      const sessionSelect = document.getElementById("sessionSelect");
      const idx = sessionSelect ? parseInt(sessionSelect.value, 10) : 0;
      const session = currentSessions[isNaN(idx) ? 0 : idx];
      if (!session) return;
      loadSessionForPlayback(session);
    }

    function initSessionControls() {
      const playerSelect = document.getElementById("playerSelect");
      const monthSelect = document.getElementById("monthSelect");
      const playBtn = document.getElementById("sessionPlayBtn");
      const sessionSelect = document.getElementById("sessionSelect");

      if (playerSelect) {
        playerSelect.innerHTML = "";
        ROUTE_PLAYERS.forEach((p, i) => {
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = p.name;
          playerSelect.appendChild(opt);
        });
        playerSelect.addEventListener("change", async () => {
          const p = ROUTE_PLAYERS[parseInt(playerSelect.value, 10)];
          if (p) {
            currentPlayerColor = p.color || currentPlayerColor;
            currentPlayerHash = p.hash;
            await loadAndRenderPlayer(p.hash);
            loadSelectedSession();
            if (heatmapEnabled) await refreshHeatmapLayer();
            if (fogEnabled) { await ensureFogData(); redrawFog(); }
          }
        });
      }

      if (monthSelect) {
        monthSelect.addEventListener("change", async () => {
          if (!monthSelect.value) return;
          await loadSessionsForMonth(currentPlayerHash, monthSelect.value);
          loadSelectedSession();
        });
      }

      if (sessionSelect) {
        sessionSelect.addEventListener("change", () => {
          const idx = parseInt(sessionSelect.value, 10);
          if (!isNaN(idx) && currentSessions[idx]) {
            setActiveSessionPill(idx);
            loadSessionForPlayback(currentSessions[idx]);
          }
        });
      }

      const speedBtn = document.getElementById("speedBtn");
      if (speedBtn) speedBtn.addEventListener("click", cyclePlaybackSpeed);

      // Map tab keyboard: space play/pause, left/right step a segment.
      document.addEventListener("keydown", (e) => {
        const mapPanel = document.getElementById("panel-map");
        if (!mapPanel || !mapPanel.classList.contains("active")) return;
        const tag = (e.target && e.target.tagName) || "";
        if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
        if (e.code === "Space") {
          e.preventDefault();
          if (!activePlayback) {
            const idx = parseInt(sessionSelect.value, 10);
            if (!isNaN(idx) && currentSessions[idx]) playSession(currentSessions[idx]);
          } else {
            playPause();
          }
        } else if (e.code === "ArrowLeft") {
          e.preventDefault(); stepFrame(-1);
        } else if (e.code === "ArrowRight") {
          e.preventDefault(); stepFrame(1);
        }
      });

      if (playBtn) playBtn.addEventListener("click", () => {
        if (!activePlayback) {
          const idx = parseInt(sessionSelect.value, 10);
          if (!isNaN(idx) && currentSessions[idx]) playSession(currentSessions[idx]);
          return;
        }
        playPause();
      });

      const scrubber = document.getElementById("sessionScrubber");
      if (scrubber) {
        scrubber.addEventListener("input", () => {
          if (!activePlayback) return;
          activePlayback.paused = true;
          activePlayback.flashing = false;
          setPlayButtonIcon(true);
          const frac = parseInt(scrubber.value, 10) / 1000;
          activePlayback.elapsedMs = frac * activePlayback.PLAYBACK_MS;
          activePlayback.lastAnnouncedSegIndex = findSegmentIndex(activePlayback.segments, frac);
          activePlayback.seekTo(frac, true);
        });
      }

      if (ROUTE_PLAYERS.length) {
        currentPlayerColor = ROUTE_PLAYERS[0].color || currentPlayerColor;
        currentPlayerHash = ROUTE_PLAYERS[0].hash;
        loadAndRenderPlayer(ROUTE_PLAYERS[0].hash);
      }
    }

    (function setSeasonTint() {
      const month = new Date().getMonth();
      const tints = {
        winter: "rgba(79,142,240,0.18)",
        spring: "rgba(123,216,143,0.14)",
        summer: "rgba(255,210,79,0.13)",
        autumn: "rgba(255,159,67,0.16)",
      };
      const season = [11, 0, 1].includes(month) ? "winter"
        : [2, 3, 4].includes(month) ? "spring"
        : [5, 6, 7].includes(month) ? "summer" : "autumn";
      document.documentElement.style.setProperty("--season-tint", tints[season]);
    })();

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    async function renderPatchNotes() {
      const el = document.getElementById("patchNoteBanner");
      try {
        const res = await fetch("data/patch-notes.json?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) return;
        const note = await res.json();
        if (!note || !note.title) return;
        const dateStr = note.pubDate ? new Date(note.pubDate).toLocaleDateString("en-US", {
          month: "short", day: "numeric"
        }) : "";
        el.innerHTML = '<div class="patch-banner">' +
          '<span class="pb-tag">Latest update</span>' +
          '<a href="' + escapeHtml(note.link || "#") + '" target="_blank" rel="noopener">' + escapeHtml(note.title) + '</a>' +
          (dateStr ? '<span class="pb-date">' + dateStr + '</span>' : '') +
          '</div>';
      } catch (err) {
        console.error("Patch notes error:", err);
      }
    }

    async function fetchLatest() {
      const res = await fetch("data/latest.json?t=" + Date.now(), { cache: "no-store" });
      return await res.json();
    }

    let lastRenderedUpdated = null;

    async function renderSkillsBoard(data) {
      lastRenderedUpdated = data.updated;
      document.getElementById("updated").textContent =
        "Updated " + new Date(data.updated).toLocaleString();

      const board = document.getElementById("board");
      board.innerHTML = "";
      const histories = await Promise.all(data.players.map(p => loadHistory(p.username)));

      let globalStartDate = null;
      histories.forEach(h => {
        (h && h.history ? h.history : []).forEach(e => {
          if (!e.totalGain || e.totalGain <= 0) return;
          const day = londonDateKey(new Date(e.timestamp));
          if (!globalStartDate || day < globalStartDate) globalStartDate = day;
        });
      });

      data.players.forEach((player, i) => {
        board.appendChild(renderColumn(player, histories[i], globalStartDate));
      });
      renderGauntletLuck(data.players);
      renderRangerLuck(data.players);
    }

    // The tracker updates hourly; a tab left open picks that up on its own
    // rather than showing stale numbers until a manual reload. Never
    // re-renders while a route is playing.
    const REFRESH_POLL_MS = 5 * 60 * 1000;
    async function pollForUpdates() {
      if (document.hidden) return;
      if (activePlayback && !activePlayback.paused) return;
      try {
        const data = await fetchLatest();
        if (data && data.updated && data.updated !== lastRenderedUpdated) {
          await renderSkillsBoard(data);
        }
      } catch (err) {
        console.debug("Update poll failed", err);
      }
    }

    async function init() {
      let data;
      try {
        data = await fetchLatest();
      } catch (err) {
        document.getElementById("updated").textContent = "Failed to load data.";
        console.error(err);
        return;
      }
      await renderSkillsBoard(data);
      initTabs();
      renderPatchNotes();
      initSessionControls();
      setInterval(pollForUpdates, REFRESH_POLL_MS);
    }

    init();

    // Tile cache (see sw.js). Only map tiles are cached; page and data
    // files are untouched.
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(err => console.debug("SW register failed", err));
    }
  </script>
</body>
