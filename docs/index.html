    // Runs whenever the Map tab becomes active: makes sure Leaflet is
    // initialized (it can't be set up while the panel was display:none,
    // since a zero-size container breaks its internal size/position
    // calculations), resizes it to fit, and positions the view on whatever
    // session is currently loaded (or a default overview if none yet).
    function activateMapPanel() {
      requestAnimationFrame(() => {
        initLeafletMap();
        leafletMap.invalidateSize();
        if (currentSessions.length) {
          loadSelectedSession();
        } else {
          leafletMap.setView(gameToLatLng(3221.5, 3217), 6);
        }
        // A second invalidateSize shortly after - the fixed-position overlay's
        // CSS layout can still be settling when the first (rAF-timed) call
        // runs, leaving Leaflet's internal container-size cache stale. Every
        // zoom-around-cursor calculation after that anchors to the wrong
        // point, which looks exactly like zooming jumping to the wrong tile.
        setTimeout(() => { if (leafletMap) leafletMap.invalidateSize(); }, 150);
      });
    }

    function initTabs() {
      // Scoped to .tabs .tab-btn specifically - the map panel's Close/Play
      // buttons reuse the .tab-btn class purely for matching styling, but
      // have no data-tab attribute and must never be treated as tab
      // switches (that previously caused a crash: getElementById("panel-
      // undefined") returns null, then .classList throws).
      document.querySelectorAll(".tabs .tab-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".tabs .tab-btn").forEach(b => b.classList.remove("active"));
          document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
          btn.classList.add("active");
          document.getElementById("panel-" + btn.dataset.tab).classList.add("active");
          if (btn.dataset.tab === "map") activateMapPanel();
        });
      });
    }

    // ---- Coordinate system: matching Explv's reference implementation ----
    //
    // Critical detail: Explv's map passes NO `crs` option to L.map(), which
    // means it uses Leaflet's DEFAULT CRS (EPSG3857 / Web Mercator), not
    // CRS.Simple. Everything below is built on that same assumption, so the
    // constants and the project/unproject calls line up exactly with his.
    //
    // An earlier version here used L.CRS.Simple with a hand-fitted
    // least-squares calibration. That was a mistake born of a bad check:
    // Lumbridge's y-pixel (460256) was compared against
    // MAP_HEIGHT_MAX_ZOOM_PX (364544) and declared "out of bounds", so his
    // formula was wrongly rejected. But that constant is just the y-flip
    // offset, NOT a bound - the real bound is the CRS world size at max
    // zoom, 256 * 2^11 = 524288, and 460256 fits inside it fine. His
    // formula was correct all along.
    const MAP_HEIGHT_MAX_ZOOM_PX = 364544;
    const MAP_WIDTH_MAX_ZOOM_PX = 104448;
    const RS_TILE_WIDTH_PX = 32, RS_TILE_HEIGHT_PX = 32; // px per game tile at max zoom
    const RS_OFFSET_X = 1024 - 64; // 960
    const RS_OFFSET_Y = 6208;
    const MAP_MIN_ZOOM = 4, MAP_MAX_ZOOM = 11;

    // Game coords -> Leaflet LatLng. Mirrors Position.toLatLng() exactly.
    // Requires the map to exist (uses map.unproject), so anything needing a
    // position before init must be deferred until after initLeafletMap().
    function gameToLatLng(gameX, gameY) {
      const x = ((gameX - RS_OFFSET_X) * RS_TILE_WIDTH_PX) + (RS_TILE_WIDTH_PX / 4);
      const y = MAP_HEIGHT_MAX_ZOOM_PX - ((gameY - RS_OFFSET_Y) * RS_TILE_HEIGHT_PX);
      return leafletMap.unproject(L.point(x, y), MAP_MAX_ZOOM);
    }

    // Leaflet LatLng -> game coords. Mirrors Position.fromLatLng() exactly.
    function latLngToGame(latlng) {
      const point = leafletMap.project(latlng, MAP_MAX_ZOOM);
      let y = MAP_HEIGHT_MAX_ZOOM_PX - point.y + (RS_TILE_HEIGHT_PX / 4);
      y = Math.round((y - RS_TILE_HEIGHT_PX) / RS_TILE_HEIGHT_PX) + RS_OFFSET_Y;
      const x = Math.round((point.x - RS_TILE_WIDTH_PX) / RS_TILE_WIDTH_PX) + RS_OFFSET_X;
      return { x, y };
    }

    let leafletMap = null;
    let currentPlane = 0;
    let planeTileLayer = null;
    let routeLayerGroup = null;

    // Tracks which tile URLs have already been requested or have finished
    // loading, across the whole page session (not just one route) - avoids
    // re-requesting the same tiles every time a session revisits a common
    // spot (e.g. home teleporting five times shouldn't fire five duplicate
    // fetches for the same five tiles).
    const requestedTileUrls = new Set();
    const loadedTileUrls = new Set();
    // Keeps references to in-flight prefetch Image objects so the browser
    // can't garbage-collect (and silently abort) an unreferenced image
    // mid-fetch. Trimmed periodically rather than left to grow forever.
    let prefetchImageRefs = [];

    // Returns the list of {x, y, z} tile coordinates in a (2*radius+1)
    // square around a point at a given zoom, with Leaflet's own tms:true
    // row-flip already applied - i.e. exactly the set of coordinates the
    // real tile layer would ask for if you panned there.
    function tileCoordsAround(latlng, zoom, radius) {
      const point = leafletMap.project(latlng, zoom);
      const tileSize = 256;
      const centerTx = Math.floor(point.x / tileSize);
      const centerTy = Math.floor(point.y / tileSize);
      const maxTy = Math.pow(2, zoom) - 1;
      const coords = [];
      for (let dx = -radius; dx <= radius; dx++) {
        for (let dy = -radius; dy <= radius; dy++) {
          coords.push({ x: centerTx + dx, y: maxTy - (centerTy + dy), z: zoom });
        }
      }
      return coords;
    }

    // Fetches a grid of tiles around a given point via plain Image()
    // requests, ahead of when they're actually needed - the browser caches
    // the response, so by the time Leaflet's own tile layer asks for the
    // same URL (e.g. when a teleport snaps the camera there) it's often
    // already loaded instead of showing black.
    //
    // Uses planeTileLayer.getTileUrl() rather than hand-building the URL -
    // that's the exact same code path Leaflet's real tile layer uses, so
    // there's no risk of a subtle mismatch (e.g. crossOrigin handling)
    // causing the browser to treat the prefetch and the "real" request as
    // different cache entries and fetch twice.
    //
    // Returns the list of URLs requested, so callers can later check
    // loadedTileUrls to see whether they've actually finished.
    function preloadTilesAround(latlng, zoom, radius, priority) {
      if (!planeTileLayer || !leafletMap) return [];
      const coords = tileCoordsAround(latlng, zoom, radius);
      const urls = coords.map(c => planeTileLayer.getTileUrl(c));
      urls.forEach(url => {
        if (requestedTileUrls.has(url)) return; // already fetched or in flight
        requestedTileUrls.add(url);
        const img = new Image();
        if (priority) img.fetchPriority = priority; // ignored harmlessly where unsupported
        img.onload = () => loadedTileUrls.add(url);
        img.onerror = () => loadedTileUrls.add(url); // don't hang forever on a missing tile
        img.src = url;
        prefetchImageRefs.push(img);
      });
      // Cap how many stale references we hang onto - old sessions'
      // prefetches are long since resolved by the time this grows large.
      if (prefetchImageRefs.length > 2000) prefetchImageRefs = prefetchImageRefs.slice(-1000);
      return urls;
    }

    // Preloads a teleport destination across FOLLOW_ZOOM (wide radius,
    // high priority - this is the zoom actually used for the vast
    // majority of snaps) plus a narrower radius at one zoom level either
    // side and whatever zoom the map is actually sitting at right now, if
    // different - the camera snap uses Math.max(currentZoom, FOLLOW_ZOOM),
    // so a viewer already zoomed in past FOLLOW_ZOOM lands there instead,
    // and that zoom level wouldn't otherwise get prefetched at all.
    //
    // Returns the FOLLOW_ZOOM URL list specifically, so playback can check
    // whether the tiles actually used for the snap are ready yet.
    function preloadTeleportDestination(latlng, followZoom) {
      const primaryUrls = preloadTilesAround(latlng, followZoom, 3, "high");
      [followZoom - 1, followZoom + 1].forEach(z => {
        if (z >= MAP_MIN_ZOOM && z <= MAP_MAX_ZOOM) preloadTilesAround(latlng, z, 1, "low");
      });
      if (leafletMap) {
        const liveZoom = Math.round(leafletMap.getZoom());
        if (liveZoom !== followZoom) preloadTilesAround(latlng, liveZoom, 2, "low");
      }
      return primaryUrls;
    }

    // Known route-tracker players, keyed by their RuneLite account hash -
    // matches the <hash>-YYYY-MM.json naming the plugin uploads under
    // route-data/. Add an entry here for each player once their hash is
    // known (visible in the filename after their first real upload).
    const ROUTE_PLAYERS = [
      { name: "6LR", hash: "-8886915111317579996" },
      { name: "5JV", hash: "" },
      { name: "Iron Shiifty", hash: "" }
    ];

    function currentYearMonth() {
      const d = new Date();
      return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0");
    }

    // Fetches a player's current-month route-data file from the repo. On
    // any failure (file doesn't exist yet, network error, bad JSON) returns
    // an empty array rather than throwing, so the UI can show "no sessions"
    // cleanly instead of breaking.
    async function fetchPlayerSessions(hash) {
      try {
        const path = "route-data/" + hash + "-" + currentYearMonth() + ".json";
        const res = await fetch(path + "?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) return [];
        const data = await res.json();
        return Array.isArray(data) ? data : [];
      } catch (err) {
        console.error("Route data fetch error:", err);
        return [];
      }
    }

    // Populates the session dropdown from the given list, showing a
    // human-readable start time + duration for each so sessions are easy
    // to tell apart once there are many.
    function populateSessionSelect(sessions) {
      const select = document.getElementById("sessionSelect");
      if (!select) return;
      select.innerHTML = "";
      if (!sessions.length) {
        const opt = document.createElement("option");
        opt.textContent = "No sessions yet";
        opt.disabled = true;
        select.appendChild(opt);
        return;
      }
      sessions.forEach((session, i) => {
        const opt = document.createElement("option");
        opt.value = i;
        const startDate = new Date(session.start * 1000);
        const durationMin = Math.round((session.end - session.start) / 60);
        opt.textContent = startDate.toLocaleString(undefined, {
          month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
        }) + " (" + durationMin + "m)";
        select.appendChild(opt);
      });
    }

    function initLeafletMap() {
      if (leafletMap) return;
      // Deliberately NO `crs` option - uses Leaflet's default EPSG3857,
      // exactly as Explv's working map does. The coordinate math above is
      // built on that assumption. Zoom is constrained on the tile layer
      // only (also matching his setup), not on the map object.
      leafletMap = L.map("leafletMap", {
        zoomControl: false,
        attributionControl: false,
        renderer: L.canvas()
      });
      L.control.zoom().addTo(leafletMap);

      planeTileLayer = L.tileLayer(
        "https://lwr27.github.io/rs-map-tiles/tiles/" + currentPlane + "/{z}/{x}/{y}.png", {
        minZoom: MAP_MIN_ZOOM,
        maxZoom: MAP_MAX_ZOOM,
        noWrap: true,
        tms: true, // tiles are stored bottom-row-first; with the default CRS
                    // Leaflet's own tms flip works correctly, so the custom
                    // getTileUrl subclass used previously is no longer needed
        keepBuffer: 8 // preload a wider ring of tiles around the visible area,
                       // so nearby pans/jumps are more likely to already have
                       // tiles cached rather than showing black while they load
      }).addTo(leafletMap);

      routeLayerGroup = L.layerGroup().addTo(leafletMap);

      // Initial view - set after the map exists, since gameToLatLng needs
      // map.unproject(). Mirrors how Explv calls setView at the end of init.
      leafletMap.setView(gameToLatLng(3221, 3217), 7);

      initPlaneControl();

      const closeBtn = document.getElementById("mapCloseBtn");
      if (closeBtn) closeBtn.addEventListener("click", () => {
        document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        document.querySelectorAll(".tab-panel").forEach(p => p.classList.remove("active"));
        document.getElementById("panel-skills").classList.add("active");
        document.querySelector('.tab-btn[data-tab="skills"]').classList.add("active");
      });
    }

    // Switches the displayed floor (0=ground, 1-3=upper floors/basements).
    // Just swaps the tile layer's URL template - Leaflet reloads whichever
    // tiles are needed for the current view under the new plane, using the
    // exact same coordinate math (game-to-latlng doesn't depend on plane at
    // all; only which tile image set is shown does).
    function switchPlane(plane) {
      if (!leafletMap || !planeTileLayer || plane === currentPlane) return;
      currentPlane = plane;
      planeTileLayer.setUrl("https://lwr27.github.io/rs-map-tiles/tiles/" + currentPlane + "/{z}/{x}/{y}.png");
      renderPlaneButtons();
      // Redraw whatever session path is currently selected, so only this
      // plane's route segments show (see eventLatLngs/renderSessionPath).
      const sessionSelect = document.getElementById("sessionSelect");
      const idx = sessionSelect ? parseInt(sessionSelect.value, 10) : NaN;
      if (!isNaN(idx) && currentSessions[idx]) renderSessionPath([currentSessions[idx]]);
    }

    function renderPlaneButtons() {
      document.querySelectorAll(".plane-btn").forEach(btn => {
        btn.classList.toggle("active", parseInt(btn.dataset.plane, 10) === currentPlane);
      });
    }

    function initPlaneControl() {
      const container = document.getElementById("planeControl");
      if (!container) return;
      container.innerHTML = "";
      [0, 1, 2, 3].forEach(p => {
        const btn = document.createElement("button");
        btn.className = "tab-btn plane-btn";
        btn.dataset.plane = p;
        btn.textContent = p;
        btn.title = p === 0 ? "Ground floor" : "Floor " + p;
        btn.addEventListener("click", () => switchPlane(p));
        container.appendChild(btn);
      });
      renderPlaneButtons();
    }

    // Expands an event into the full ordered list of game-coordinate points
    // it covers: start, any recorded turn waypoints, then end. Walk events
    // carry a flat [x1,y1,x2,y2,...] waypoint array (`w`) recording every
    // direction change, so a winding route draws as its real shape rather
    // than a straight line between endpoints. Straight walks and teleports
    // have no waypoints and collapse to just two points.
    function eventLatLngs(ev) {
      const pts = [gameToLatLng(ev.f[0], ev.f[1])];
      if (ev.ty === "walk" && Array.isArray(ev.w)) {
        for (let i = 0; i + 1 < ev.w.length; i += 2) {
          pts.push(gameToLatLng(ev.w[i], ev.w[i + 1]));
        }
      }
      pts.push(gameToLatLng(ev.t[0], ev.t[1]));
      return pts;
    }

    // Same point-list expansion as eventLatLngs, but in raw game
    // coordinates (f -> any waypoints -> t) rather than map lat/lng. Used
    // to compute real per-leg tile distances for playback timing - see
    // loadSessionForPlayback.
    function eventGameCoords(ev) {
      const pts = [{ x: ev.f[0], y: ev.f[1] }];
      if (ev.ty === "walk" && Array.isArray(ev.w)) {
        for (let i = 0; i + 1 < ev.w.length; i += 2) {
          pts.push({ x: ev.w[i], y: ev.w[i + 1] });
        }
      }
      pts.push({ x: ev.t[0], y: ev.t[1] });
      return pts;
    }

    // Draws a single session's route as Leaflet polylines - walks as solid
    // blue lines following every recorded waypoint. Teleports have no
    // static line drawn at all - the animated marker itself shows where
    // teleports go during playback, rather than a separate always-visible
    // connector line.
    function renderSessionPath(sessions) {
      if (!routeLayerGroup) return;
      routeLayerGroup.clearLayers();

      const WALK_COLOR = "#4f8ef0";

      sessions.forEach(session => {
        session.events.forEach(ev => {
          if (ev.ty === "bank" || !ev.f || !ev.t) return;
          if (ev.f[2] !== currentPlane) return; // only this floor's segments
          if (ev.ty !== "walk") return; // teleports get no static line
          const latlngs = eventLatLngs(ev);

          L.polyline(latlngs, {
            color: WALK_COLOR,
            weight: 3,
            opacity: 0.9,
            lineJoin: "round",
            lineCap: "round"
          }).addTo(routeLayerGroup);
        });
      });
    }

    // ---- Playback ----

    let playbackAnimationId = null;
    let activePlayback = null;
    let lastFrameTime = null;
    let playbackMarker = null;
    let playbackHalo = null;

    // The teleport swirl always plays at least this long (so it reads as a
    // deliberate beat, not a flicker) but never longer than this even if
    // tiles are still loading - actual duration in between is driven by
    // whether the destination's tiles have genuinely finished loading yet
    // (see the polling check in globalPlaybackTick below).
    const TELEPORT_FLASH_MIN_MS = 220;
    const TELEPORT_FLASH_MAX_MS = 800;

    // Finds which segment a given playback fraction (0-1) falls in. Shared
    // by seekTo (for positioning) and globalPlaybackTick (for detecting
    // when organic forward playback is about to cross into a new segment).
    function findSegmentIndex(segments, frac) {
      for (let i = 0; i < segments.length; i++) {
        if (frac >= segments[i].startFrac && frac < segments[i].endFrac) return i;
      }
      return segments.length - 1;
    }

    // Plays a brief expanding/fading ring at the given position, mimicking
    // an OSRS-style teleport swirl. Purely cosmetic on its own, but used
    // alongside pausing the playback clock (see globalPlaybackTick) so the
    // destination's tiles get a bit longer to finish loading before the
    // camera actually snaps there.
    function playTeleportFlash(latlng) {
      if (!leafletMap) return;
      const start = performance.now();
      const ring = L.circleMarker(latlng, {
        radius: 6, color: "#fff", weight: 2, fillColor: "#8ecbff", fillOpacity: 0.6
      }).addTo(leafletMap);
      function tick(now) {
        const t = Math.min(1, (now - start) / TELEPORT_FLASH_MIN_MS);
        ring.setRadius(6 + t * 22);
        ring.setStyle({ opacity: 1 - t, fillOpacity: 0.6 * (1 - t) });
        if (t < 1) {
          requestAnimationFrame(tick);
        } else {
          leafletMap.removeLayer(ring);
        }
      }
      requestAnimationFrame(tick);
    }

    function globalPlaybackTick(now) {
      if (lastFrameTime === null) lastFrameTime = now;
      const dt = now - lastFrameTime;
      lastFrameTime = now;

      if (activePlayback && !activePlayback.paused) {
        if (activePlayback.flashing) {
          // Holding mid-teleport-swirl. Clears itself below once either
          // the destination's tiles are confirmed loaded (after at least
          // the minimum beat, so it never reads as a flicker) or the max
          // cap is hit regardless - whichever comes first.
          const elapsed = now - activePlayback.flashStart;
          const urls = activePlayback.flashTileUrls;
          const tilesReady = !!urls && urls.every(u => loadedTileUrls.has(u));
          if (elapsed >= TELEPORT_FLASH_MIN_MS && (tilesReady || elapsed >= TELEPORT_FLASH_MAX_MS)) {
            activePlayback.flashing = false;
          }
        } else {
          const prospectiveMs = Math.min(
            activePlayback.PLAYBACK_MS,
            activePlayback.elapsedMs + dt
          );
          const prospectiveFrac = prospectiveMs / activePlayback.PLAYBACK_MS;
          const idx = findSegmentIndex(activePlayback.segments, prospectiveFrac);
          const enteringNewTeleport =
            idx !== activePlayback.lastAnnouncedSegIndex &&
            activePlayback.lastAnnouncedSegIndex !== -1 &&
            !activePlayback.segments[idx].isWalk;

          if (enteringNewTeleport) {
            // Commit the crossing right now - both the clock and the
            // recorded segment index - so the flash genuinely represents
            // "we've arrived, holding here a beat" rather than leaving the
            // clock stuck before the crossing. Leaving elapsedMs
            // uncommitted here was the bug: the next tick would recompute
            // the same crossing and re-trigger the flash forever.
            activePlayback.elapsedMs = prospectiveMs;
            activePlayback.lastAnnouncedSegIndex = idx;
            activePlayback.flashing = true;
            activePlayback.flashStart = now;
            activePlayback.flashTileUrls = activePlayback.segments[idx].tileUrls;
            playTeleportFlash(playbackMarker.getLatLng());
          } else {
            activePlayback.elapsedMs = prospectiveMs;
            activePlayback.lastAnnouncedSegIndex = idx;
            activePlayback.seekTo(prospectiveFrac, false);
            if (playbackHalo) {
              playbackHalo.setRadius(9 + Math.sin(activePlayback.elapsedMs / 180) * 3);
            }
            if (prospectiveFrac >= 1) {
              activePlayback.paused = true;
              setPlayButtonIcon(true);
            }
          }
        }
      }
      requestAnimationFrame(globalPlaybackTick);
    }
    requestAnimationFrame(globalPlaybackTick);

    function setPlayButtonIcon(showPlay) {
      const btn = document.getElementById("sessionPlayBtn");
      if (btn) btn.textContent = showPlay ? "▶" : "⏸";
    }

    // Loads a session for playback: builds the route segments (one per leg
    // of every event's path, through waypoints), places the marker at the
    // very start (paused), and points the camera there. Does NOT start
    // playing automatically.
    function loadSessionForPlayback(session) {
      initLeafletMap();
      const statusEl = document.getElementById("sessionStatus");
      const scrubber = document.getElementById("sessionScrubber");
      activePlayback = null;
      if (!session || !session.events || !session.events.length) {
        if (statusEl) statusEl.textContent = "No events";
        return;
      }

      if (playbackMarker) { leafletMap.removeLayer(playbackMarker); playbackMarker = null; }
      if (playbackHalo) { leafletMap.removeLayer(playbackHalo); playbackHalo = null; }

      playbackHalo = L.circleMarker([0, 0], {
        radius: 9, color: "none", fillColor: "#ff3b3b", fillOpacity: 0.25
      }).addTo(leafletMap);
      playbackMarker = L.circleMarker([0, 0], {
        radius: 6, color: "#fff", weight: 2, fillColor: "#ff3b3b", fillOpacity: 1
      }).addTo(leafletMap);

      const FOLLOW_ZOOM = 8;
      const MS_PER_TILE = 90;   // constant on-screen walking speed - every
                                // tile takes the same amount of playback
                                // time, so a long straight run naturally
                                // takes proportionally longer to watch than
                                // a short one, rather than everything being
                                // squeezed into one fixed-length window.
      const TP_DURATION_MS = 150; // teleports get one short fixed beat,
                                // regardless of distance - they're a cut,
                                // not travel (the separate swirl pause for
                                // tile loading happens on top of this, in
                                // globalPlaybackTick).

      const events = session.events.filter(ev =>
        ev && Array.isArray(ev.f) && Array.isArray(ev.t) &&
        ev.f.length >= 2 && ev.t.length >= 2 && typeof ev.s === "number");
      if (!events.length) {
        if (statusEl) statusEl.textContent = "No valid events";
        return;
      }

      // Real-world session time span (used for the elapsed/total readout).
      // Teleports are treated as instantaneous in real time too, same as
      // they are in-game.
      const t0 = events[0].s;
      const lastEv = events[events.length - 1];
      const lastEvEnd = lastEv.ty === "walk" ? (lastEv.e != null ? lastEv.e : lastEv.s) : lastEv.s;
      const t1 = Math.max(t0 + 1, lastEvEnd);

      // Each event expands into one sub-segment per leg of its path
      // (through any recorded waypoints), so the marker traces the real
      // route shape rather than cutting corners. Each leg's own on-screen
      // duration is now a direct, constant-speed function of its actual
      // tile distance (walks) or a fixed short beat (teleports) - overall
      // playback length is just whatever that sums to, not squeezed into a
      // fixed window, so longer sessions naturally take longer to watch
      // (that's what the scrubber is for). Each sub-segment also carries
      // its own slice of real session time (realFrom/realTo), distributed
      // proportionally by tile distance within the event, so the
      // elapsed-time readout advances in step with the animation.
      const rawSegments = [];
      events.forEach(ev => {
        const isWalk = ev.ty === "walk";
        const pts = eventLatLngs(ev);
        const gamePts = eventGameCoords(ev);
        const evRealStart = ev.s;
        const evRealEnd = isWalk ? (ev.e != null ? ev.e : ev.s) : ev.s;

        const legTileLens = [];
        let totalTileLen = 0;
        for (let i = 0; i + 1 < gamePts.length; i++) {
          const len = Math.max(0.0001, Math.hypot(
            gamePts[i + 1].x - gamePts[i].x, gamePts[i + 1].y - gamePts[i].y));
          legTileLens.push(len);
          totalTileLen += len;
        }
        let cumLen = 0;
        for (let i = 0; i + 1 < pts.length; i++) {
          const lenBefore = cumLen;
          cumLen += legTileLens[i];
          const lenAfter = cumLen;
          const durationMs = isWalk ? legTileLens[i] * MS_PER_TILE
            : TP_DURATION_MS;
          rawSegments.push({
            from: pts[i], to: pts[i + 1], isWalk,
            plane: ev.t[2], // destination plane - lets playback auto-switch floors
            durationMs,
            realFrom: evRealStart + (evRealEnd - evRealStart) * (lenBefore / totalTileLen),
            realTo: evRealStart + (evRealEnd - evRealStart) * (lenAfter / totalTileLen)
          });
        }
      });

      const PLAYBACK_MS = Math.max(1, rawSegments.reduce((a, s) => a + s.durationMs, 0));
      let cumMs = 0;
      const segments = rawSegments.map(s => {
        const startFrac = cumMs / PLAYBACK_MS;
        cumMs += s.durationMs;
        return {
          from: s.from, to: s.to, isWalk: s.isWalk, plane: s.plane,
          startFrac, endFrac: cumMs / PLAYBACK_MS,
          realFrom: s.realFrom, realTo: s.realTo,
          tileUrls: null // populated below for teleport segments only
        };
      });

      // Teleport destinations are known the instant a session loads (they're
      // just data, not something that needs to actually happen first), so
      // kick off loading their tiles in the background right away - well
      // before playback's near-instant jump reaches that point, so the
      // camera snap is far less likely to land on still-loading black tiles.
      //
      // Staggered in playback order (a short delay per teleport) rather
      // than fired all at once - with several teleports in one session,
      // firing every request simultaneously means they all compete for the
      // browser's limited concurrent-connection pool, which can actually
      // delay the very first (soonest-needed) one. Staggering lets the
      // earliest teleports' tiles land first, since they're needed first.
      //
      // Each segment's FOLLOW_ZOOM tile URLs are recorded on it too, so the
      // teleport-swirl flash can later check real load state via
      // loadedTileUrls instead of guessing a fixed duration.
      const teleportSegments = segments.filter(s => !s.isWalk);
      teleportSegments.forEach((s, i) => {
        setTimeout(() => {
          s.tileUrls = preloadTeleportDestination(s.to, FOLLOW_ZOOM);
        }, i * 20);
      });

      // Positions the marker/halo/camera for a given fraction (0-1) through
      // the route, and updates the elapsed/total real-time readout to
      // match. Shared by every control (play loop, scrubber, step buttons)
      // so there's one source of truth for "where is the route at frac X".
      // Teleports snap the camera instantly (it's a jump, not travel);
      // walks pan smoothly.
      function seekTo(frac, snapCamera) {
        frac = Math.min(1, Math.max(0, frac));
        const idx = findSegmentIndex(segments, frac);
        const seg = segments[idx];
        const segFrac = Math.min(1, Math.max(0,
          (frac - seg.startFrac) / Math.max(0.0001, seg.endFrac - seg.startFrac)));
        const lat = seg.from.lat + (seg.to.lat - seg.from.lat) * segFrac;
        const lng = seg.from.lng + (seg.to.lng - seg.from.lng) * segFrac;
        const latlng = L.latLng(lat, lng);

        if (typeof seg.plane === "number" && seg.plane !== currentPlane) {
          switchPlane(seg.plane);
        }

        playbackMarker.setLatLng(latlng);
        playbackHalo.setLatLng(latlng);

        const shouldSnap = snapCamera || !seg.isWalk;
        if (shouldSnap) {
          leafletMap.setView(latlng, Math.max(leafletMap.getZoom(), FOLLOW_ZOOM), { animate: false });
        } else {
          leafletMap.panTo(latlng, { animate: true, duration: 0.15, easeLinearity: 1 });
        }

        const realTime = seg.realFrom + (seg.realTo - seg.realFrom) * segFrac;
        const elapsedSec = realTime - t0;
        const totalSec = t1 - t0;
        if (statusEl) statusEl.textContent = formatDuration(elapsedSec) + " / " + formatDuration(totalSec);
        if (scrubber) scrubber.value = Math.round(frac * 1000);
      }

      activePlayback = {
        PLAYBACK_MS, seekTo, segments, elapsedMs: 0, paused: true,
        lastAnnouncedSegIndex: -1, flashing: false
      };
      seekTo(0, true);
      activePlayback.lastAnnouncedSegIndex = findSegmentIndex(segments, 0);
      setPlayButtonIcon(true);
    }

    // Toggles play/pause on whatever session is currently loaded. If
    // playback had already finished, pressing play again restarts from 0.
    function playPause() {
      if (!activePlayback) return;
      if (activePlayback.elapsedMs >= activePlayback.PLAYBACK_MS) {
        activePlayback.elapsedMs = 0;
        activePlayback.lastAnnouncedSegIndex = findSegmentIndex(activePlayback.segments, 0);
        activePlayback.flashing = false;
      }
      activePlayback.paused = !activePlayback.paused;
      lastFrameTime = null; // avoid a large dt jump from time spent paused
      setPlayButtonIcon(activePlayback.paused);
    }

    // Steps to the previous/next event-leg boundary and pauses there. A
    // manual step is a deliberate jump, not organic forward playback - it
    // always uses snapCamera (no fade delay) and updates
    // lastAnnouncedSegIndex directly so resuming play from here won't
    // immediately think it just "arrived" at a teleport and flash again.
    function stepFrame(direction) {
      if (!activePlayback) return;
      activePlayback.paused = true;
      activePlayback.flashing = false;
      setPlayButtonIcon(true);
      const targetIndex = Math.min(
        activePlayback.segments.length - 1,
        Math.max(0, findSegmentIndex(activePlayback.segments,
          activePlayback.elapsedMs / activePlayback.PLAYBACK_MS) + direction)
      );
      const segs = activePlayback.segments;
      const targetFrac = direction > 0 ? segs[targetIndex].endFrac : segs[targetIndex].startFrac;
      activePlayback.elapsedMs = targetFrac * activePlayback.PLAYBACK_MS;
      activePlayback.lastAnnouncedSegIndex = targetIndex;
      activePlayback.seekTo(targetFrac, true);
    }

    function playSession(session) {
      loadSessionForPlayback(session);
      if (activePlayback) {
        activePlayback.paused = false;
        lastFrameTime = null;
        setPlayButtonIcon(false);
      }
    }

    // Holds whichever player's sessions are currently loaded, so the Play
    // button (and any future controls) can reference the live list rather
    // than a stale closure captured at setup time.
    let currentSessions = [];

    async function loadAndRenderPlayer(hash) {
      currentSessions = await fetchPlayerSessions(hash);
      populateSessionSelect(currentSessions);
      // Route drawing and playback positioning are deferred to
      // activateMapPanel (via loadSelectedSession) rather than triggered
      // here - at page load the map panel is still display:none, and
      // initializing Leaflet against a hidden, zero-size container breaks
      // its tile/position calculations.
    }

    // Loads whichever session is currently selected in the dropdown (or
    // the first one, if none is explicitly selected yet) for both the
    // static path drawing and playback positioning. Only ever called while
    // the map panel is actually visible.
    function loadSelectedSession() {
      const sessionSelect = document.getElementById("sessionSelect");
      const idx = sessionSelect ? parseInt(sessionSelect.value, 10) : 0;
      const session = currentSessions[isNaN(idx) ? 0 : idx];
      if (!session) return;
      renderSessionPath([session]);
      loadSessionForPlayback(session);
    }

    function initSessionControls() {
      const playerSelect = document.getElementById("playerSelect");
      const playBtn = document.getElementById("sessionPlayBtn");
      const sessionSelect = document.getElementById("sessionSelect");

      if (playerSelect) {
        playerSelect.innerHTML = "";
        ROUTE_PLAYERS.forEach((p, i) => {
          const opt = document.createElement("option");
          opt.value = i;
          opt.textContent = p.name;
          playerSelect.appendChild(opt);
        });
        playerSelect.addEventListener("change", async () => {
          const p = ROUTE_PLAYERS[parseInt(playerSelect.value, 10)];
          if (p) {
            await loadAndRenderPlayer(p.hash);
            loadSelectedSession();
          }
        });
      }

      // Selecting a session loads it for playback (paused, positioned at
      // the start) AND redraws the static path to show only that session's
      // route, rather than leaving every other session's path visible too.
      if (sessionSelect) {
        sessionSelect.addEventListener("change", () => {
          const idx = parseInt(sessionSelect.value, 10);
          if (!isNaN(idx) && currentSessions[idx]) {
            renderSessionPath([currentSessions[idx]]);
            loadSessionForPlayback(currentSessions[idx]);
          }
        });
      }

      if (playBtn) playBtn.addEventListener("click", () => {
        if (!activePlayback) {
          const idx = parseInt(sessionSelect.value, 10);
          if (!isNaN(idx) && currentSessions[idx]) playSession(currentSessions[idx]);
          return;
        }
        playPause();
      });

      // The scrubber only needs to pause + seek on drag - the always-running
      // global playback loop naturally continues from wherever elapsedMs
      // ends up once paused is set back to false, so there's no separate
      // resume logic needed here (unlike the earlier duplicated-tick version).
      const scrubber = document.getElementById("sessionScrubber");
      if (scrubber) {
        scrubber.addEventListener("input", () => {
          if (!activePlayback) return;
          activePlayback.paused = true;
          activePlayback.flashing = false;
          setPlayButtonIcon(true);
          const frac = parseInt(scrubber.value, 10) / 1000;
          activePlayback.elapsedMs = frac * activePlayback.PLAYBACK_MS;
          activePlayback.lastAnnouncedSegIndex = findSegmentIndex(activePlayback.segments, frac);
          activePlayback.seekTo(frac, true);
        });
      }

      // Load the first known player on open.
      if (ROUTE_PLAYERS.length) loadAndRenderPlayer(ROUTE_PLAYERS[0].hash);
    }

    // Very subtle seasonal tint - a faint colour shift in the background
    // gradient, nothing animated or attention-grabbing.
    (function setSeasonTint() {
      const month = new Date().getMonth(); // 0=Jan
      const tints = {
        winter: "rgba(79,142,240,0.18)",   // Dec/Jan/Feb - cool blue
        spring: "rgba(123,216,143,0.14)",  // Mar/Apr/May - soft green
        summer: "rgba(255,210,79,0.13)",   // Jun/Jul/Aug - warm gold
        autumn: "rgba(255,159,67,0.16)",   // Sep/Oct/Nov - amber
      };
      const season = [11, 0, 1].includes(month) ? "winter"
        : [2, 3, 4].includes(month) ? "spring"
        : [5, 6, 7].includes(month) ? "summer" : "autumn";
      document.documentElement.style.setProperty("--season-tint", tints[season]);
    })();

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    async function renderPatchNotes() {
      const el = document.getElementById("patchNoteBanner");
      try {
        const res = await fetch("data/patch-notes.json?t=" + Date.now(), { cache: "no-store" });
        if (!res.ok) return;
        const note = await res.json();
        if (!note || !note.title) return;
        const dateStr = note.pubDate ? new Date(note.pubDate).toLocaleDateString("en-US", {
          month: "short", day: "numeric"
        }) : "";
        el.innerHTML = '<div class="patch-banner">' +
          '<span class="pb-tag">Latest update</span>' +
          '<a href="' + escapeHtml(note.link || "#") + '" target="_blank" rel="noopener">' + escapeHtml(note.title) + '</a>' +
          (dateStr ? '<span class="pb-date">' + dateStr + '</span>' : '') +
          '</div>';
      } catch (err) {
        console.error("Patch notes error:", err);
      }
    }

    async function init() {
      let data;
      try {
        const res = await fetch("data/latest.json?t=" + Date.now(), { cache: "no-store" });
        data = await res.json();
      } catch (err) {
        document.getElementById("updated").textContent = "Failed to load data.";
        console.error(err);
        return;
      }

      document.getElementById("updated").textContent =
        "Updated " + new Date(data.updated).toLocaleString();

      const board = document.getElementById("board");
      const histories = await Promise.all(data.players.map(p => loadHistory(p.username)));

      // Earliest calendar day (UK date) ANY player has a recorded XP gain -
      // shared across all three calendars so they all start on the same
      // real week, rather than each player's grid independently starting
      // from their own first-played date. Recomputed live from the actual
      // data every load, so it stays correct automatically (new month, a
      // new player added, earlier history compacted, etc.) with nothing to
      // manually update here.
      let globalStartDate = null;
      histories.forEach(h => {
        (h && h.history ? h.history : []).forEach(e => {
          if (!e.totalGain || e.totalGain <= 0) return;
          const day = londonDateKey(new Date(e.timestamp));
          if (!globalStartDate || day < globalStartDate) globalStartDate = day;
        });
      });

      data.players.forEach((player, i) => {
        board.appendChild(renderColumn(player, histories[i], globalStartDate));
      });

      initTabs();
      renderGauntletLuck(data.players);
      renderRangerLuck(data.players);
      renderPatchNotes();
      initSessionControls();
    }

    init();
  </script>
</body>
</html>
